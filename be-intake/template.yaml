AWSTemplateFormatVersion: "2010-09-09"
Description: wonderfulkb-ingest - API key secret and App Runner instance role

Parameters:
  RawBucket:
    Type: String
    Default: wonderfulkb-raw-document-storage
  AuditTableName:
    Type: String
    Default: wonderfulkb-uw-document-processing-audit
  MonitorAuthSecretArn:
    Type: String
    Default: ""
    Description: Dedicated server-owned monitoring SERVICE policy secret ARN (never its value)

Conditions:
  HasMonitorAuth: !Not [!Equals [!Ref MonitorAuthSecretArn, ""]]

Resources:
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: wonderfulkb/ingest-api-key
      Description: x-api-key for wonderfulkb-ingest (Wonderful upload)
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - {Key: project, Value: wonderfulkb}

  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Existing intake instance role supports the separate audit store and fresh server-owned SERVICE grants.
        must: Audit access is PutItem/Query on the separate table; monitoring policy read is GetSecretValue on the exact optional secret ARN. Preserve existing upload permissions.
    Properties:
      RoleName: wonderfulkb-ingest-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: tasks.apprunner.amazonaws.com}
            Action: sts:AssumeRole
      Tags:
        - {Key: project, Value: wonderfulkb}
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
                Resource: !Sub "arn:aws:s3:::${RawBucket}/cases/*"
              - Sid: CleanupOwnUploads
                # jen úklid: po selhání transakce ingest smaže verzi objektu, kterou sám nahrál (main.py remove_uncommitted)
                Effect: Allow
                Action: [s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub "arn:aws:s3:::${RawBucket}/cases/*/original/*"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wonderfulkb-uw-documents"
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wonderfulkb-uw-cases"
              - Sid: ContentHashes
                # index obsahových hashů (dedup napříč případy, infra/validator-agent/dedup): čtení a idempotentní zápis
                Effect: Allow
                Action: [dynamodb:Query, dynamodb:UpdateItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wonderfulkb-uw-content-hashes"
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTableName}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApiKeySecret
        - !If
          - HasMonitorAuth
          - PolicyName: monitoring-service-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref MonitorAuthSecretArn
          - !Ref AWS::NoValue

Outputs:
  MonitorAuthSecretArn: {Value: !Ref MonitorAuthSecretArn}
  SecretArn: {Value: !Ref ApiKeySecret}
  InstanceRoleArn: {Value: !GetAtt InstanceRole.Arn}
