# Ruční vizuální kontrola podpisů ve vzorových PDF dvou původních případů (docs/vzorove-dokumenty/solom-rec, stavby-fiser).
# Zdroj pravdy S_REVIEW v truth.yaml. Postup: každá strana každého PDF se vykreslila (pypdfium2) a prohlédla; u skenů
# a nejasných míst se vyříznutá oblast prohlédla ve větším zvětšení. Zapsáno bez pohledu na výstup detektorů.
# Co se počítá jako podpis: rukou psaný tah v podpisovém poli, včetně tahu přes razítko (razítko samo bez tahu se
# nepočítá). Rukou psaná jména a poznámky (např. „VITASIL“, „CC 3100“) a prázdná podpisová pole se nepočítají.
# Úroveň: `page` = počet podpisů na straně (poloha na straně se nezapisovala, takže se porovnává jen strana a počet).
# Omezení: jeden posuzovatel (Claude), bez druhé kontroly člověkem; drobné paraf a velmi světlé tahy mohly uniknout.
# Role jsou informativní (vyhodnocují se jen u podpisů s bbox, tady se nepoužijí).
reviewed_by: Claude (vizuální kontrola vykreslených stran)
reviewed_on: "2026-10-19"
