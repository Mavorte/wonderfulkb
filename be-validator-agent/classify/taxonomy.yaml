# Taxonomie typů dokumentů pro klasifikaci (viz docs/kontroly-a-entity.md, docs/dokumenty-a-skupiny.md).
# ID štítků jsou shodná s infra/validator-agent-mock/seed.py (LABELS), aby šly výstupy spojit.
#
# Pravidla (rules) běží nad normalizovaným textem: malá písmena, bez diakritiky, bílé znaky sloučené do mezery.
#   zone: title = prvních `title_chars` znaků, head = prvních `head_chars` znaků, any = celý text
#   re:   regulární výraz (hledá se re.search v dané zóně), w: váha; pravidlo se započítá nejvýš jednou.
# Název souboru se k pravidlům nikdy nepoužívá.

settings:
  title_chars: 300      # zóna "title": začátek dokumentu
  head_chars: 2500      # zóna "head": hlavička a úvod
  accept_score: 9       # minimální skóre nejlepšího štítku pro přijetí bez modelu
  accept_margin: 4      # minimální náskok před druhým štítkem
  min_text_chars: 40    # kratší text = dokument bez textové vrstvy, model se nevolá

labels:
  smlouva_o_uveru:
    group: "0x"
    name: Smlouva o úvěru
    description: Úvěrová smlouva mezi poskytovatelem financování (SGEF) a příjemcem financování na pořízení předmětu financování; šablonový dokument se stranami, parametry úvěru, výčtem požadovaných podkladů, zajištěním a podpisovou tabulkou.
    key_signs:
      - odkaz na § 2395 a násl. občanského zákoníku, „poskytovatel financování jako úvěrující“
      - identifikace poskytovatele a příjemce financování, předmět financování, dodavatel, PKC, výše úvěru
      - výčet požadovaných podkladů, zajištění, pojištění, odkaz na VOP, podpisová tabulka
    rules:
      - {zone: title, re: '^\s*(smlouva o uveru|smlouva o poskytnuti uveru)', w: 8}
      - {zone: head, re: 'uzavrena v souladu s ustanovenim .{0,4}2395', w: 6}
      - {zone: head, re: 'poskytovatelem financovani jako uverujicim', w: 4}
      - {zone: any, re: 'vyse poskytnuteho uveru', w: 3}
      - {zone: any, re: 'predbezna kupni cena bez dph', w: 2}
      - {zone: any, re: 'predmet financovani', w: 2}
      - {zone: any, re: 'vseobecne obchodni podminky ke smlouve o uveru', w: 2}

  vop:
    group: "0x"
    name: Všeobecné obchodní podmínky (VOP)
    description: Všeobecné obchodní podmínky ke smlouvě o úvěru (několik desítek stran právního textu, které se jen podepisují); nenesou údaje o konkrétním případu.
    key_signs:
      - kód verze „CZ_VOP_…“ v záhlaví
      - „Tyto všeobecné obchodní podmínky (VOP) tvoří nedílnou součást smlouvy o úvěru“
      - dlouhý šablonový text bez údajů o stranách a předmětu
    rules:
      - {zone: title, re: 'cz_vop_', w: 8}
      - {zone: title, re: '^\s*vseobecne obchodni podminky', w: 8}
      - {zone: head, re: 'tyto vseobecne obchodni podminky', w: 5}
      - {zone: head, re: 'tvori nedilnou soucast smlouvy o uveru', w: 4}

  dodatek_ke_smlouve:
    group: "0x"
    name: Dodatek ke smlouvě o úvěru
    description: Dodatek, který mění nebo doplňuje existující smlouvu o úvěru (odkazuje na číslo původní smlouvy a uvádí měněná ustanovení).
    key_signs:
      - nadpis „Dodatek č. …“ ke smlouvě č. …
      - „tímto dodatkem se mění“, „ostatní ustanovení smlouvy zůstávají nedotčena“
    rules:
      - {zone: title, re: '^\s*(dodatek c\.?|dodatek ke smlouve|dodatek cislo)', w: 8}
      - {zone: head, re: 'tento dodatek', w: 4}
      - {zone: any, re: 'ostatni ustanoveni smlouvy zustavaji nedotcena', w: 4}
      - {zone: any, re: 'se meni nasledovne', w: 3}

  dohoda_o_zaplaceni_kupni_ceny:
    group: "0x/1x"
    name: Dohoda o zaplacení kupní ceny
    description: Třístranná dohoda ke kupní smlouvě/objednávce a smlouvě o úvěru mezi poskytovatelem financování, prodávajícím a kupujícím (příjemcem) o způsobu zaplacení kupní ceny, DPH a podmínkách výplaty.
    key_signs:
      - nadpis „Dohoda ke kupní smlouvě/objednávce č. … a smlouvě o úvěru č. …“
      - identifikace poskytovatele financování, prodávajícího a kupujícího
      - podmínky výplaty kupní ceny, DPH, vrácení plateb, převod vlastnického práva
    rules:
      - {zone: title, re: '^\s*dohoda (ke kupni smlouve|o zaplaceni kupni ceny|k )', w: 8}
      - {zone: head, re: 'identifikace prodavajiciho', w: 4}
      - {zone: head, re: 'jako kupujiciho', w: 3}
      - {zone: any, re: 'dohodly se, ze dph', w: 2}
      - {zone: any, re: 'dle teto dohody', w: 2}

  objednavka:
    group: "1x"
    name: Objednávka / kupní smlouva
    description: Objednávka nebo kupní smlouva mezi objednatelem (příjemcem financování) a dodavatelem na dodání předmětu financování (strany s IČO, položky, cena bez DPH, termín plnění); může obsahovat přiloženou technickou specifikaci.
    key_signs:
      - nadpis „Objednávka č. …“ nebo „Kupní smlouva č. …“
      - objednatel / dodavatel s IČO a DIČ, položky a množství, cena celkem bez DPH, termín plnění
      - obchodní podmínky, podpisy obou stran
    rules:
      - {zone: title, re: 'objednavka (c\.|cislo|c )', w: 8}
      - {zone: title, re: '^\s*(kupni smlouva|smlouva o koupi)', w: 8}
      - {zone: head, re: 'objednavame u vas', w: 4}
      - {zone: head, re: 'objednatel', w: 3}
      - {zone: any, re: 'cena celkem bez dph', w: 3}
      - {zone: any, re: 'potvrzeni objednavky', w: 2}

  technicka_specifikace:
    group: "1x"
    name: Technická specifikace
    description: Technická specifikace nebo cenová nabídka předmětu financování (parametry, výbava, rozměry, typ a model stroje).
    key_signs:
      - nadpis „Technická specifikace“, „Technické parametry“
      - tabulka parametrů a výbavy stroje, bez smluvních stran a podpisové tabulky
    rules:
      - {zone: title, re: 'technicka specifikace', w: 8}
      - {zone: head, re: 'technicke parametry|technicky popis', w: 4}
      - {zone: head, re: 'cenova nabidka', w: 3}

  predavaci_protokol:
    group: "1x"
    name: Předávací protokol / potvrzení o převodu vlastnictví
    description: Protokol o předání a převzetí předmětu financování nebo potvrzení dodavatele o převodu vlastnického práva po úhradě kupní ceny (předmět, výrobní číslo, číslo faktury, datum převodu, podpis).
    key_signs:
      - nadpis „Potvrzení o převodu vlastnického práva“, „Předávací protokol“, „Protokol o předání“
      - výrobní číslo předmětu, číslo faktury, datum převodu, podpis dodavatele
    rules:
      - {zone: title, re: 'potvrzeni o prevodu vlastnickeho prava', w: 8}
      - {zone: title, re: 'potvrzeni o prechodu vlastnictvi', w: 8}
      - {zone: title, re: 'predavaci protokol|protokol o predani|protokol o prevzeti|predavaci a prejimaci protokol', w: 8}
      - {zone: any, re: 'vlastnicke pravo k .{0,40}specifikovanemu predmetu', w: 4}
      - {zone: any, re: 'zakoupila predmet', w: 3}
      - {zone: any, re: 'splnila cely dluh vyplyvajici z teto faktury', w: 3}

  uhrada_kupni_ceny:
    group: "1x"
    name: Doklad o úhradě
    description: Bankovní doklad o provedené platbě (oznámení o provedení příkazu k úhradě, výpis z účtu) s účty plátce a příjemce, částkou, datem a symboly platby.
    key_signs:
      - „Oznámení o provedení příkazu k úhradě“, „Payment order processing notification“, výpis z účtu
      - na vrub / ve prospěch účtu, částka a měna, datum splatnosti, variabilní symbol
    rules:
      - {zone: title, re: 'oznameni o provedeni prikazu k uhrade', w: 8}
      - {zone: title, re: 'vypis z uctu|potvrzeni o (platbe|uhrade)|potvrzeni o provedeni platby', w: 8}
      - {zone: head, re: 'payment order', w: 4}
      - {zone: head, re: 'prikaz k uhrade', w: 4}
      - {zone: head, re: 'na vrub uctu', w: 3}
      - {zone: head, re: 've prospech uctu', w: 3}
      - {zone: head, re: 'stav prikazu', w: 2}

  faktura:
    group: "1x"
    name: Faktura / daňový doklad
    description: Faktura nebo daňový doklad dodavatele za předmět financování (dodavatel, odběratel, výrobní číslo, částka, DPH, bankovní účet, splatnost).
    key_signs:
      - nadpis „Faktura“, „Faktura – daňový doklad“, „Zálohová faktura“
      - dodavatel a odběratel, datum vystavení a zdanitelného plnění, variabilní symbol, cena s DPH, splatnost
    rules:
      - {zone: title, re: '^\s*(faktura|danovy doklad|zalohova faktura|proforma)', w: 8}
      - {zone: title, re: 'faktura (c\.|cislo|-)', w: 6}
      - {zone: head, re: 'datum zdanitelneho plneni', w: 4}
      - {zone: head, re: 'odberatel', w: 3}
      - {zone: head, re: 'cislo faktury', w: 3}
      - {zone: head, re: 'variabilni symbol', w: 1}

  zajistovaci_prevod_vlastnickeho_prava:
    group: "2-4"
    name: Zajišťovací převod vlastnického práva
    description: Standardní formulář smlouvy o zajišťovacím převodu vlastnického práva k předmětu financování na poskytovatele financování jako zajištění úvěru (strany, předmět, výrobní číslo, hodnota, podpisy).
    key_signs:
      - nadpis „Smlouva o zajišťovacím převodu vlastnického práva“, odkaz na § 2040 a násl. občanského zákoníku
      - zajišťovaná smlouva o úvěru, předmět zajištění, výrobní číslo
    rules:
      - {zone: title, re: 'smlouva o zajistovacim prevodu vlastnickeho prava', w: 9}
      - {zone: head, re: 'zajistovaci prevod', w: 4}
      - {zone: any, re: 'predmet zajisteni', w: 2}
      - {zone: any, re: 'zajistovane pohledavky|zajistovaneho zavazku', w: 2}

  vinkulace_pojisteni:
    group: "2-4"
    name: Vinkulace pojistného plnění
    description: Formulář vinkulace pojištění, v němž se pojistitel neodvolatelně zavazuje vyplatit pojistné plnění k předmětu pojištění poskytovateli financování (pojistník, předmět, výrobní číslo, začátek pojištění, číslo pojistné smlouvy, pojistná částka).
    key_signs:
      - pole „Příjemce financování (Pojistník)“, „Rozsah pojištění“, „Předmět pojištění“, „Číslo pojistné smlouvy“
      - „pojistitel se neodvolatelně zavazuje“, podpis a razítko pojistitele, ručně doplněná pole
    rules:
      - {zone: title, re: 'vinkulace', w: 8}
      - {zone: head, re: 'pojistnik', w: 3}
      - {zone: head, re: 'predmet pojisteni', w: 3}
      - {zone: head, re: 'rozsah pojisteni', w: 3}
      - {zone: any, re: 'pojistitel se neodvolatelne zavazuje', w: 4}
      - {zone: any, re: 'cislo pojistne smlouvy', w: 2}
      - {zone: any, re: 'pojistna castka', w: 1}

  ruceni:
    group: "2-4"
    name: Prohlášení o ručení
    description: Ručitelské prohlášení, kterým ručitel převzetím ručení podle § 2018 a násl. občanského zákoníku zajišťuje dluhy příjemce financování vůči poskytovateli financování (ručitel s IČ, číslo smlouvy, příjemce financování).
    key_signs:
      - strany „Od“ (ručitel) a „Vůči“ (SGEF), „ve věci“ příjemce financování
      - „Ručitel tímto prohlašuje, že ve smyslu § 2018 a násl. … přebírá ručení“
    rules:
      - {zone: title, re: 'prohlaseni o ruceni|rucitelske prohlaseni|smlouva o ruceni', w: 9}
      - {zone: head, re: 'dale jen rucitel', w: 4}
      - {zone: head, re: 'rucitel timto prohlasuje', w: 6}
      - {zone: any, re: 'prohlasuje, ze ve smyslu .{0,4}2018', w: 6}
      - {zone: any, re: 'prebira .{0,10}ruceni', w: 4}
      - {zone: any, re: 'rucitel', w: 2}

  data_ze_systemu:
    group: "99"
    name: Kontrola smlouvy (záznam ze systému)
    description: Výstup ze systému banky („Kontrola smlouvy č. …“) s referenčními údaji o smlouvě, klientovi, předmětu, dodavateli, faktuře, platbě, pojištění a ručení, se kterými se ostatní dokumenty porovnávají.
    key_signs:
      - nadpis „Kontrola smlouvy č.:“, pole Produkt, Rámec, Typ transakce, Security score
      - datum schválení, podpisu a účinnosti, stav smlouvy, klient (Nájemce, IČ, DIČ), číslo obchodního případu
    rules:
      - {zone: title, re: '^\s*kontrola smlouvy', w: 9}
      - {zone: head, re: 'security score', w: 4}
      - {zone: head, re: 'cislo obch\. pripadu', w: 3}
      - {zone: any, re: 'datum schvaleni', w: 2}
      - {zone: any, re: 'datum ucinnosti', w: 2}
      - {zone: any, re: 'annu sazba', w: 2}

  jine:
    group: ""
    name: Jiný dokument
    description: Dokument, který nepatří do žádného z výše uvedených typů nebo z jehož textu typ nelze určit.
    key_signs:
      - žádný z uvedených typů nesedí
      - text je příliš krátký nebo nečitelný na určení typu
    rules: []
