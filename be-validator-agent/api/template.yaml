AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
# Nasazení schvaluje uživatel (be-validator-agent/docs/validator-agent-storage.md, pravidla pro všechny části).
#   sam build && sam deploy --guided --profile hackathon --region eu-central-1 --stack-name wonderfulkb-agent-api
# Pozor: sam build zabalí celý adresář; testy, fixtury a server.py se do Lambdy dostanou také (nejsou použité).
Description: wonderfulkb validator agent API (document / vectors / signatures; odkrytí podpisu = jen KMS Decrypt)

Parameters:
  AnalysisTable: {Type: String, Default: wonderfulkb-uw-document-analysis}
  # Tabulky Case & Client API (stejná Lambda obsluhuje /cases a /clients; tabulky vlastní část 1, jen data, ne životní cyklus).
  # CasesTable zároveň rozlišuje "case existuje, ale nemá dokumenty" (200 []) od 404.
  CasesTable: {Type: String, Default: wonderfulkb-uw-cases}
  ClientsTable: {Type: String, Default: wonderfulkb-uw-clients}
  ClientsIcoIndex: {Type: String, Default: ico-index}
  CasesClientCreatedIndex: {Type: String, Default: client-created-index}
  RawBucket: {Type: String, Default: wonderfulkb-raw-document-storage}
  VectorBucket: {Type: String, Default: wonderfulkb-vectors}
  ApiKeySecretName: {Type: String, Default: wonderfulkb/ingest-api-key}
  # Duplicity napříč případy (dedup/): index hashů a tabulka dokumentů ingestu (čte se jen atribut sha256).
  # Prázdný ContentHashesTable funkci vypne (pole duplicate_of a duplicate_relevant se pak nevracejí).
  ContentHashesTable: {Type: String, Default: wonderfulkb-uw-content-hashes}
  DocumentsTable: {Type: String, Default: wonderfulkb-uw-documents}
  # KMS klíč pro odkrytí podpisů (alias/wonderfulkb-signatures); jen Decrypt, jen s kontextem case/document/signature.
  # ID klíče za aliasem SignatureKmsAlias (v repu není; deploy.sh ho zjistí kms:DescribeKey a předá).
  SignatureKmsKeyId: {Type: String, AllowedPattern: '[0-9a-f-]{36}'}
  SignatureKmsAlias: {Type: String, Default: alias/wonderfulkb-signatures}
  # Přechod z `crop_url` (viz README). DOČASNĚ true do migrace starých čitelných výřezů (rozhodnutí uživatele, audit V3):
  # nezmigrované sig_NN.png (např. SYN-A01) dál vracejí crop_url, šifrované .png.enc jdou jen přes /image.
  # Po migraci vrátit na "false". CropUrlCompat výchozí false = žádný klíč `crop_url` u šifrovaných výřezů.
  LegacyPlainCropUrl: {Type: String, Default: "true", AllowedValues: ["false", "true"]}
  CropUrlCompat: {Type: String, Default: "false", AllowedValues: ["false", "true"]}

Conditions:
  HasContentHashes: !Not [!Equals [!Ref ContentHashesTable, ""]]

Resources:
  # Vlastní role místo AWSLambdaBasicExecutionRole (ta dává logs:* na všechny skupiny).
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wonderfulkb-agent-api-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAnalysisTable
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}"
              # Case & Client API (dříve role wonderfulkb-lambda-role Lambdy wonderfulkb-case-client): čtení klientů a případů,
              # založení případu = transakce ConditionCheck na aktivního klienta + Put s attribute_not_exists.
              - Sid: CaseClientClients
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:ConditionCheckItem]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClientsTable}"
              - Sid: CaseClientCases
                Effect: Allow
                # UpdateItem: PUT /cases/{case_id}/status (Wonderful posouvá stav případu)
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CasesTable}"
              - Sid: CaseClientIndexes
                Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClientsTable}/index/${ClientsIcoIndex}"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CasesTable}/index/${CasesClientCreatedIndex}"
              # Seznam dokumentů případu zahrnuje i nahrané a dosud nezpracované dokumenty z tabulky ingestu.
              - Sid: ListIngestDocuments
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentsTable}"
              - !If
                - HasContentHashes
                - Sid: ReadContentHashes
                  Effect: Allow
                  Action: dynamodb:Query
                  Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContentHashesTable}"
                - !Ref AWS::NoValue
              - !If
                - HasContentHashes
                - Sid: ReadDocumentHash
                  # jen GetItem; kód si žádá výhradně atribut sha256 (ProjectionExpression)
                  Effect: Allow
                  Action: dynamodb:GetItem
                  Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentsTable}"
                - !Ref AWS::NoValue
              - Sid: ReadAnalysisObjects
                # pokrývá i cases/*/analysis/*/signatures/* (šifrované výřezy a náhledy pro odkrytí); nic dalšího
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${RawBucket}/cases/*/analysis/*"
              - Sid: PresignDocumentFiles
                # …/pages: zamaskovaná kopie (redacted/); …/original: čitelný originál, jen odkaz na 60 s s auditem.
                # Předpodepsaná adresa platí jen s oprávněním role, která ji podepsala.
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${RawBucket}/cases/*/redacted/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${RawBucket}/cases/*/original/*"
              - Sid: ReadIngestDocument
                # klíč, název a typ originálu (ProjectionExpression s3_key, filename, content_type)
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentsTable}"
              - Sid: RevealSignatureCrops
                # Odkrytí (dešifrování) smí jen toto API, ne pipeline. Jen Decrypt, jen tento klíč a jen volání s kontextem,
                # který obsahuje právě case_id, document_id, signature_id (Null chrání před voláním bez kontextu, kdy by
                # ForAllValues vyšlo vždy pravdivě). Žádné GenerateDataKey, Encrypt ani ReEncrypt.
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${SignatureKmsKeyId}"
                Condition:
                  "ForAllValues:StringEquals":
                    "kms:EncryptionContextKeys": [case_id, document_id, signature_id]
                  "Null":
                    "kms:EncryptionContextKeys": "false"
              - Sid: ListAnalysisPrefix
                # jen kvůli rozlišení "objekt neexistuje" od "zamítnuto" (signatures.json, stránky, kopie, originál)
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${RawBucket}"
                Condition:
                  StringLike:
                    "s3:prefix": ["cases/*/analysis/*", "cases/*/redacted/*", "cases/*/original/*"]
              - Sid: ReadVectors
                Effect: Allow
                Action: [s3vectors:GetVectors, s3vectors:QueryVectors]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucket}/index/wonderfulkb-text"
                  - !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucket}/index/wonderfulkb-image"
                  - !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucket}/index/wonderfulkb-signatures"
              - Sid: ReadApiKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Secrets Manager přidává k názvu 6 náhodných znaků
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApiKeySecretName}-??????"
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
      Tags:
        - {Key: project, Value: wonderfulkb}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/wonderfulkb-agent-api
      RetentionInDays: 14
      Tags:
        - {Key: project, Value: wonderfulkb}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wonderfulkb-agent-api
      Description: wonderfulkb API (případy a klienti, dokumenty, vektory, podpisy, odkrytí podpisu)
      CodeUri: .
      Handler: app.handler
      Runtime: python3.14
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 20
      Role: !GetAtt ApiRole.Arn
      Tags:
        project: wonderfulkb
        component: agent-api
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          ANALYSIS_TABLE: !Ref AnalysisTable
          CASES_TABLE: !Ref CasesTable
          # Case & Client API (case_client_handler)
          DATA_BACKEND: dynamodb
          ALLOW_EPHEMERAL_MOCK: "false"
          CLIENTS_TABLE_NAME: !Ref ClientsTable
          CASES_TABLE_NAME: !Ref CasesTable
          CLIENTS_ICO_INDEX_NAME: !Ref ClientsIcoIndex
          CASES_CLIENT_CREATED_INDEX_NAME: !Ref CasesClientCreatedIndex
          HASHES_TABLE: !Ref ContentHashesTable
          DOCUMENTS_TABLE: !Ref DocumentsTable
          RAW_BUCKET: !Ref RawBucket
          VECTOR_BUCKET: !Ref VectorBucket
          API_KEY_SECRET: !Ref ApiKeySecretName
          PRIVACY_KMS_KEY_ID: !Ref SignatureKmsAlias
          LEGACY_PLAIN_CROP_URL: !Ref LegacyPlainCropUrl
          CROP_URL_COMPAT: !Ref CropUrlCompat
          # API_KEY se v AWS nenastavuje; klíč se čte ze Secrets Manageru.
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        CreateCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases
            Method: POST
        SetCaseStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{case_id}/status
            Method: PUT
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /healthz
            Method: GET

  # Stage v1 => adresa https://<id>.execute-api.eu-central-1.amazonaws.com/v1/cases/... jako v OpenAPI.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Tags:
        project: wonderfulkb
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
