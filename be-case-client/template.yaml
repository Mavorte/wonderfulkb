{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "wonderfulkb Case & Client; explicit ephemeral mock or external DynamoDB adapter. No database lifecycle resources.",
  "Parameters": {
    "DataBackend": {"Type": "String", "Default": "mock", "AllowedValues": ["mock", "dynamodb"]},
    "ClientsTableName": {"Type": "String", "Default": "wonderfulkb-uw-clients", "AllowedPattern": "[A-Za-z0-9_.-]{3,255}"},
    "CasesTableName": {"Type": "String", "Default": "wonderfulkb-uw-cases", "AllowedPattern": "[A-Za-z0-9_.-]{3,255}"},
    "ClientsIcoIndexName": {"Type": "String", "Default": "ico-index", "AllowedPattern": "[A-Za-z0-9_.-]{3,255}"},
    "CasesClientCreatedIndexName": {"Type": "String", "Default": "client-created-index", "AllowedPattern": "[A-Za-z0-9_.-]{3,255}"},
    "ExternalTablesAccountId": {"Type": "String", "Default": "609394381050", "AllowedPattern": "[0-9]{12}"}
  },
  "Conditions": {"UseDynamoDB": {"Fn::Equals": [{"Ref": "DataBackend"}, "dynamodb"]}},
  "Resources": {
    "CaseClientLogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "Bounded demo logging without payload logging", "must": "Seven-day retention; name matches function without a resource cycle"}},
      "Properties": {
        "LogGroupName": {"Fn::Sub": "/aws/lambda/${AWS::StackName}-case-client"},
        "RetentionInDays": 7,
        "Tags": [{"Key": "project", "Value": "wonderfulkb"}]
      }
    },
    "CaseClientRole": {
      "Type": "AWS::IAM::Role",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "Scoped logs and conditional external table access", "must": "Mock has no DB rights; no table lifecycle, S3 or VPC permissions"}},
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{"Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}, "Action": "sts:AssumeRole"}]
        },
        "Policies": [{
          "PolicyName": "CaseClientLogsOnly",
          "PolicyDocument": {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow", "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": {"Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-case-client:log-stream:*"}
            }]
          }
        }, {"Fn::If": ["UseDynamoDB", {
          "PolicyName": "CaseClientExternalDynamoDB",
          "PolicyDocument": {"Version": "2012-10-17", "Statement": [
            {"Effect": "Allow", "Action": ["dynamodb:GetItem", "dynamodb:Scan", "dynamodb:ConditionCheckItem"],
             "Resource": {"Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${ExternalTablesAccountId}:table/${ClientsTableName}"}},
            {"Effect": "Allow", "Action": ["dynamodb:Query"],
             "Resource": {"Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${ExternalTablesAccountId}:table/${ClientsTableName}/index/${ClientsIcoIndexName}"}},
            {"Effect": "Allow", "Action": ["dynamodb:GetItem", "dynamodb:PutItem"],
             "Resource": {"Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${ExternalTablesAccountId}:table/${CasesTableName}"}},
            {"Effect": "Allow", "Action": ["dynamodb:Query"],
             "Resource": {"Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${ExternalTablesAccountId}:table/${CasesTableName}/index/${CasesClientCreatedIndexName}"}}
          ]}
        }, {"Ref": "AWS::NoValue"}]}],
        "Tags": [{"Key": "project", "Value": "wonderfulkb"}]
      }
    },
    "CaseClientApi": {
      "Type": "AWS::Serverless::Api",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "Existing contract uses a REST API and x-api-key", "must": "All four methods require API key; never enable request body or key logging"}},
      "Properties": {
        "StageName": "v1",
        "Auth": {"ApiKeyRequired": true},
        "GatewayResponses": {
          "INVALID_API_KEY": {"StatusCode": "403", "ResponseTemplates": {"application/json": "{\"error\":\"Forbidden\"}"}},
          "ACCESS_DENIED": {"StatusCode": "403", "ResponseTemplates": {"application/json": "{\"error\":\"Forbidden\"}"}},
          "DEFAULT_4XX": {"StatusCode": "403", "ResponseTemplates": {"application/json": "{\"error\":\"Forbidden\"}"}},
          "THROTTLED": {"StatusCode": "429", "ResponseTemplates": {"application/json": "{\"error\":\"Too many requests\"}"}},
          "QUOTA_EXCEEDED": {"StatusCode": "429", "ResponseTemplates": {"application/json": "{\"error\":\"Quota exceeded\"}"}}
        },
        "Tags": {"project": "wonderfulkb"}
      }
    },
    "CaseClientFunction": {
      "Type": "AWS::Serverless::Function",
      "DependsOn": "CaseClientLogGroup",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "One on-demand handler with explicit backend", "must": "Mock is ephemeral; DynamoDB uses existing tables and execution role"}},
      "Properties": {
        "FunctionName": {"Fn::Sub": "${AWS::StackName}-case-client"},
        "CodeUri": "src/",
        "Handler": "case_client_handler.lambda_handler",
        "Runtime": "python3.13",
        "MemorySize": 256,
        "Timeout": 10,
        "Role": {"Fn::GetAtt": ["CaseClientRole", "Arn"]},
        "Environment": {"Variables": {
          "DATA_BACKEND": {"Ref": "DataBackend"},
          "ALLOW_EPHEMERAL_MOCK": {"Fn::If": ["UseDynamoDB", "false", "true"]},
          "CLIENTS_TABLE_NAME": {"Ref": "ClientsTableName"},
          "CASES_TABLE_NAME": {"Ref": "CasesTableName"},
          "CLIENTS_ICO_INDEX_NAME": {"Ref": "ClientsIcoIndexName"},
          "CASES_CLIENT_CREATED_INDEX_NAME": {"Ref": "CasesClientCreatedIndexName"}
        }},
        "Events": {
          "ListClients": {"Type": "Api", "Properties": {"RestApiId": {"Ref": "CaseClientApi"}, "Path": "/clients", "Method": "get"}},
          "ListCases": {"Type": "Api", "Properties": {"RestApiId": {"Ref": "CaseClientApi"}, "Path": "/cases", "Method": "get"}},
          "CreateCase": {"Type": "Api", "Properties": {"RestApiId": {"Ref": "CaseClientApi"}, "Path": "/cases", "Method": "post"}},
          "GetCase": {"Type": "Api", "Properties": {"RestApiId": {"Ref": "CaseClientApi"}, "Path": "/cases/{case_id}", "Method": "get"}},
          "ListClientCases": {"Type": "Api", "Properties": {"RestApiId": {"Ref": "CaseClientApi"}, "Path": "/clients/{client_id}/cases", "Method": "get"}}
        },
        "Tags": {"project": "wonderfulkb"}
      }
    },
    "CaseClientApiKey": {
      "Type": "AWS::ApiGateway::ApiKey",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "Demo gateway access key, generated by AWS", "must": "Never output its value"}},
      "Properties": {"Enabled": true, "Description": "Ephemeral mock demo only", "Tags": [{"Key": "project", "Value": "wonderfulkb"}]}
    },
    "CaseClientUsagePlan": {
      "Type": "AWS::ApiGateway::UsagePlan",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "Small demo usage plan", "must": "Reference the generated stage resource to ensure deploy ordering"}},
      "Properties": {
        "ApiStages": [{"ApiId": {"Ref": "CaseClientApi"}, "Stage": {"Ref": "CaseClientApiv1Stage"}}],
        "Throttle": {"BurstLimit": 10, "RateLimit": 5},
        "Quota": {"Limit": 1000, "Period": "DAY"},
        "Tags": [{"Key": "project", "Value": "wonderfulkb"}]
      }
    },
    "CaseClientUsagePlanKey": {
      "Type": "AWS::ApiGateway::UsagePlanKey",
      "Metadata": {"com.aws.cloudformation.Context": {"why": "Bind the generated key to the single usage plan", "must": "API_KEY binding only"}},
      "Properties": {"KeyId": {"Ref": "CaseClientApiKey"}, "KeyType": "API_KEY", "UsagePlanId": {"Ref": "CaseClientUsagePlan"}}
    }
  },
  "Outputs": {
    "ApiUrl": {"Value": {"Fn::Sub": "https://${CaseClientApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1"}},
    "FunctionName": {"Value": {"Ref": "CaseClientFunction"}},
    "RestApiId": {"Value": {"Ref": "CaseClientApi"}},
    "ApiKeyId": {"Value": {"Ref": "CaseClientApiKey"}},
    "UsagePlanId": {"Value": {"Ref": "CaseClientUsagePlan"}}
  }
}
