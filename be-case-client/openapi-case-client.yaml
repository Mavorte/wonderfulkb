openapi: 3.0.3
info:
  title: wonderfulkb Case & Client API (část 1)
  version: 1.4.0
  description: |
    Nasazeno (REST API Gateway `wonderfulkb-case-client`, stage `v1`, Lambda python3.13). Část 1: klienti (jen čtení, syntetická data) a case.
    Jedna Lambda `wonderfulkb-case-client`, tabulky wonderfulkb-uw-clients a wonderfulkb-uw-cases.
    Klient se při založení case ověřuje v databázi klientů. Část 2 (dokumenty, služba
    `wonderfulkb-ingest`) je v openapi-ingest.yaml. API klíč `x-api-key` je vlastní: klíč z usage plánu
    `wonderfulkb-demo-plan` (API Gateway). Klíč ingestu a agent API tu neplatí (403, ověřeno 19. 10. 2026).
servers:
  - url: https://{apiId}.execute-api.eu-central-1.amazonaws.com/v1
    variables:
      apiId:
        default: REPLACE_AFTER_DEPLOY
security:
  - ApiKeyAuth: []
tags:
  - name: clients
  - name: cases

paths:
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: Vylistuje klienty (s volitelným filtrem)
      description: |
        Bez filtrů vrací všechny klienty stránkovaně. Filtry se kombinují (AND).
        Jen pro čtení, databáze klientů obsahuje syntetická data.
      parameters:
        - name: ico
          in: query
          description: Přesná shoda IČO.
          schema: {type: string, pattern: '^[0-9]{8}$'}
        - name: name
          in: query
          description: Část názvu, bez ohledu na velikost písmen, diakritiku a právní formu.
          schema: {type: string, minLength: 2, maxLength: 255}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ClientStatus'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: next_token
          in: query
          description: Hodnota `next_token` z předchozí odpovědi.
          schema: {type: string}
      responses:
        '200':
          description: Stránka klientů (může být prázdná)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: Vylistuje case napříč klienty
      description: Globální stránkovaný Scan; pořadí není garantováno a klienti se neověřují.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: next_token
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Stránka případů
          content:
            application/json:
              schema:
                type: object
                required: [cases, next_token]
                properties:
                  cases: {type: array, items: {$ref: '#/components/schemas/Case'}}
                  next_token: {type: string, nullable: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [cases]
      operationId: createCase
      summary: Založí case pro klienta
      description: |
        Prostý create: `case_id` přidělí služba (UUID v4) a vrátí ho v odpovědi, v požadavku se neposílá
        (případné se ignoruje). Volání není idempotentní, každé založí nový case.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCaseRequest'}
      responses:
        '201':
          description: Case založen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Klient `client_id` neexistuje
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Klient je `inactive`/`blocked`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cases/{case_id}:
    get:
      tags: [cases]
      operationId: getCase
      summary: Vrátí case podle case_id
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/CaseId'}
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Case neexistuje
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /clients/{client_id}/cases:
    get:
      tags: [cases]
      operationId: listClientCases
      summary: Vylistuje case klienta podle client_id
      description: Řazeno od nejnovějšího. Klient musí existovat (jinak 404); klient bez case vrací prázdné pole.
      parameters:
        - name: client_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CaseStatus'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: next_token
          in: query
          description: Hodnota `next_token` z předchozí odpovědi.
          schema: {type: string}
      responses:
        '200':
          description: Stránka case klienta (může být prázdná)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Klient neexistuje
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  responses:
    BadRequest:
      description: Neplatný požadavek
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Chybí nebo je neplatný API klíč
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Překročen limit volání
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}

    ClientStatus:
      type: string
      enum: [active, inactive, blocked]

    Contact:
      type: object
      properties:
        name: {type: string}
        role: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        preferred_channel: {type: string, enum: [email, phone]}

    Signatory:
      type: object
      properties:
        name: {type: string}
        function: {type: string, example: jednatel}
        authorized: {type: boolean}

    Kyc:
      type: object
      properties:
        status: {type: string, enum: [ok, pending, failed]}
        checked_at: {type: string, format: date}

    Client:
      type: object
      required: [client_id, ico, name, status]
      properties:
        client_id: {type: string, format: uuid}
        ico: {type: string, pattern: '^[0-9]{8}$'}
        dic: {type: string, example: CZ12345678}
        name: {type: string}
        legal_form: {type: string}
        address: {type: string}
        status: {$ref: '#/components/schemas/ClientStatus'}
        contacts:
          type: array
          items: {$ref: '#/components/schemas/Contact'}
        signatories:
          type: array
          items: {$ref: '#/components/schemas/Signatory'}
        kyc: {$ref: '#/components/schemas/Kyc'}
        source: {type: string, enum: [synthetic]}

    ClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: {$ref: '#/components/schemas/Client'}
        next_token: {type: string, nullable: true}

    CaseId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]+$'
      description: ID case přidělené službou při založení (UUID). Je zároveň klíčem case v databázi.
      example: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90

    CaseStatus:
      type: string
      enum: [open]

    CaseDetails:
      type: object
      description: Údaje o case, které zobrazuje frontend (hlavička „Documents for your financing“).
      properties:
        loan_agreement_no:
          type: string
          maxLength: 64
          description: Číslo úvěrové smlouvy. Může obsahovat znaky mimo `case_id` (např. lomítko).
          example: 170170/25
        asset_name:
          type: string
          maxLength: 255
          description: Financovaný předmět.
          example: Epiroc CC 3100 demolition shears
        serial_number:
          type: string
          maxLength: 64
          description: Výrobní číslo financovaného předmětu.
          example: DGR240020

    CreateCaseRequest:
      allOf:
        - $ref: '#/components/schemas/CaseDetails'
        - type: object
          required: [client_id]
          properties:
            client_id: {type: string, format: uuid}
            metadata:
              type: object
              additionalProperties: true

    Case:
      allOf:
        - $ref: '#/components/schemas/CaseDetails'
        - type: object
          required: [case_id, client_id, status, created_at]
          properties:
            case_id: {$ref: '#/components/schemas/CaseId'}
            client_id: {type: string, format: uuid}
            status: {$ref: '#/components/schemas/CaseStatus'}
            created_at: {type: string, format: date-time}
            source:
              type: string
              enum: [synthetic]
              description: Původ dat. Nastavuje server, ve frontendu se zobrazí jako „Demo data“.
            metadata:
              type: object
              additionalProperties: true

    CaseList:
      type: object
      required: [client_id, cases]
      properties:
        client_id: {type: string, format: uuid}
        cases:
          type: array
          items: {$ref: '#/components/schemas/Case'}
        next_token: {type: string, nullable: true}
