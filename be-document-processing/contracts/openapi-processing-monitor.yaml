openapi: 3.0.3
info:
  title: WonderfulKB bounded processing observations
  version: 1.0.0
  description: |
    Required API contract; it is not evidence that these operations have been delivered or deployed.
    All reads require a server-authenticated SERVICE principal and explicit server-owned
    case grant. The intake x-api-key/shared API key never establishes monitoring case permission.
    Credentials and policy remain server-only. Authorization source failure is fail-closed
    before audit access. 403 denies access; 404 masks missing or
    unauthorized case/document/run according to existing policy; 400 rejects invalid parameters
    or operation-bound tokens; 503 means a required read failed. All responses including errors
    use Cache-Control: private, no-store. No route/deployment is asserted.
    Each request reads one bounded observation window, limit 1–100. This is not a snapshot,
    incremental feed, complete history, or latest-state guarantee. No totals or historical
    aggregation. Opaque next_token encodes the last evaluated position and is bound to the
    exact operation and explicit case/document/run/attempt scope. Empty items may accompany
    a continuation token. Coverage is partial where required; absence never synthesizes starts,
    attempts or statuses. Content, raw errors, S3 keys and artifact-content paths are excluded.
servers:
  - url: https://{host}/v1
    variables:
      host:
        default: REPLACE_WITH_EXISTING_DOCUMENT_SERVICE_HOST
security:
  - MonitoringServiceBearer: []
paths:
  /cases/{case_id}/processing/documents/{document_id}/events:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}]
    get:
      operationId: listDocumentProcessingEvents
      description: One bounded event window. FileReceived has no run scope (no run_id field); other events with run scope require run_id. Coverage is partial. Empty items with next_token is valid continuation. PageCompleted and PageFailed are the only page terminal observations; cache reuse is not a new inference; publication does not automatically terminate a run.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/DocumentEvents'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/runs/{run_id}/events:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/RunId'}]
    get:
      operationId: listProcessingEvents
      description: >-
        One bounded evaluated document-event window filtered to run_id, with no
        additional reads to fill the page. Technical EVENT#event_id order is not
        global chronology or a snapshot. FileReceived without run identity is
        excluded. Coverage is partial; empty items may have next_token and do not
        establish that a run is absent or history complete. Continuation binds
        operation, case, document and run and advances from the last evaluated
        position. Every request rechecks current SERVICE authorization (403) and
        document membership (404); authorization, membership and audit read
        failures are 503, never an empty successful history.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {name: next_token, in: query, description: Opaque run-events scoped continuation., schema: {type: string, minLength: 1, maxLength: 8192}}
      responses:
        '200': {$ref: '#/components/responses/RunEvents'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/runs/{run_id}/attempts:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/RunId'}]
    get:
      operationId: listProcessingAttempts
      description: Observed AttemptStarted attempts only; no synthetic attempts. One bounded window; coverage partial.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/Attempts'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/runs/{run_id}/steps:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/RunId'}]
    get:
      operationId: listProcessingSteps
      security: [{MonitoringServiceBearer: []}]
      description: One evaluated document Query filtered to allowlisted source_validation, extraction and executed page facts for explicit run_id and attempt_no. Technical event-identity order, not chronology. Coverage is partial; missing observations do not prove work was not performed. No start, terminal, duration or success is inferred; terminal-only fragments and empty continuation are valid. Extraction has no page_number or document values. StepFinished proves neither complete fields, a model call nor run completion. Refresh starts at the beginning without snapshot or incremental guarantees.
      parameters: [{$ref: '#/components/parameters/AttemptNo'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/Steps'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/runs/{run_id}/pages:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/RunId'}]
    get:
      operationId: listProcessingPages
      description: >-
        One bounded document Query evaluated window filtered to page observations for explicit
        run_id and attempt_no; coverage partial. Empty items with next_token are valid; the cursor
        preserves the last evaluated position and is bound to case/document/run/operation=pages/attempt_no.
        Technical event-identity order is not chronology, a snapshot or an incremental guarantee.
        Multiple observations of one page remain distinct; no totals, completion count or latest
        page status is inferred. PageCacheReused is the same stored observation exposed in events,
        not new work, a PageCompleted or an executed step. Missing starts or cache origin evidence
        do not discard reuse; origin and content availability remain unknown/unavailable without evidence.
        No current cache lookup or provider call is performed.
      parameters: [{$ref: '#/components/parameters/AttemptNo'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/Pages'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/runs:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}]
    get:
      operationId: listObservedProcessingRuns
      description: Required brief 24 bounded lifecycle read, not a complete run registry. Unknown, ambiguous and partial remain explicit; no synthetic starts, attempts or statuses. Empty items may have continuation. This operation is specified, not delivery evidence.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/RunSummaries'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/runs/{run_id}:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/RunId'}]
    get:
      operationId: getObservedProcessingRun
      description: Required brief 24 bounded detail. Unknown or ambiguous lifecycle stays explicit; result publication is separate from run terminal status; empty observations may have continuation. Specified, not delivery evidence.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/RunDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
  /cases/{case_id}/processing/documents/{document_id}/audit:
    parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/DocumentId'}]
    get:
      operationId: getObservedDocumentAudit
      description: Required brief 24 bounded lifecycle observation, partial/unknown where evidence is incomplete; never whole-history aggregation. Empty items may have continuation. Specified, not delivery evidence.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/NextToken'}]
      responses:
        '200': {$ref: '#/components/responses/DocumentAudit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ReadFailure'}
components:
  securitySchemes:
    MonitoringServiceBearer: {type: http, scheme: bearer, description: 'Server-only SERVICE credential bound to explicit server-owned case grants; never a browser claim or upload API key.'}
    ApiKeyAuth: {type: apiKey, in: header, name: x-api-key, description: 'Service authentication only, not case authorization.'}
  parameters:
    CaseId: {name: case_id, in: path, required: true, schema: {type: string, minLength: 1}}
    DocumentId: {name: document_id, in: path, required: true, schema: {type: string, minLength: 1}}
    RunId: {name: run_id, in: path, required: true, schema: {type: string, minLength: 1}}
    AttemptNo: {name: attempt_no, in: query, required: true, schema: {type: integer, minimum: 1}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    NextToken: {name: next_token, in: query, required: false, description: Opaque operation-bound last-evaluated continuation token; empty items may continue., schema: {type: string, minLength: 1}}
  headers:
    PrivateCache: {description: Sensitive response is never stored or shared, schema: {type: string, enum: ['private, no-store']}}
  responses:
    DocumentEvents: {description: Bounded document event observations., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentEventCollection'}}}}
    RunEvents: {description: Bounded run event observations., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunEventCollection'}}}}
    Attempts: {description: Bounded observed attempts., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptCollection'}}}}
    Steps: {description: Bounded step observations., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StepCollection'}}}}
    Pages: {description: Bounded page observations., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PageCollection'}}}}
    RunSummaries: {description: Bounded run lifecycle observations., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunSummaryCollection'}}}}
    RunDetail: {description: Bounded run detail observation., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunDetailCollection'}}}}
    DocumentAudit: {description: Bounded document audit observation., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentAuditCollection'}}}}
    BadRequest: {description: Invalid request or operation-bound token., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Missing or forged SERVICE identity or absent/revoked case grant., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Missing or unauthorized resource masked according to existing policy., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ReadFailure: {description: Required observation read failed., headers: {Cache-Control: {$ref: '#/components/headers/PrivateCache'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    ObservationCollection:
      type: object
      additionalProperties: false
      required: [items, next_token, observed_at, coverage]
      properties:
        items: {type: array, items: {type: object}}
        next_token: {type: string, nullable: true}
        observed_at: {type: string, format: date-time}
        coverage: {type: string, enum: [partial]}
    DocumentEventCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/DocumentEvent'}}}}]}
    RunEventCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/RunEvent'}}}}]}
    AttemptCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AttemptObservation'}}}}]}
    StepCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/StepObservation'}}}}]}
    PageCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/PageObservation'}}}}]}
    RunSummaryCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/RunSummary'}}}}]}
    RunDetailCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, minItems: 0, maxItems: 1, items: {$ref: '#/components/schemas/RunDetail'}}}}]}
    DocumentAuditCollection: {allOf: [{$ref: '#/components/schemas/ObservationCollection'}, {type: object, properties: {items: {type: array, minItems: 0, maxItems: 1, items: {$ref: '#/components/schemas/DocumentAudit'}}}}]}
    ObservationItem:
      oneOf:
        - {$ref: '#/components/schemas/FileReceived'}
        - {$ref: '#/components/schemas/RunQueued'}
        - {$ref: '#/components/schemas/AttemptStarted'}
        - {$ref: '#/components/schemas/StepStarted'}
        - {$ref: '#/components/schemas/StepFinished'}
        - {$ref: '#/components/schemas/StepFailed'}
        - {$ref: '#/components/schemas/PageCacheReused'}
        - {$ref: '#/components/schemas/PageCompleted'}
        - {$ref: '#/components/schemas/PageFailed'}
        - {$ref: '#/components/schemas/ResultPublished'}
        - {$ref: '#/components/schemas/RetryEnqueued'}
        - {$ref: '#/components/schemas/AttemptFinished'}
        - {$ref: '#/components/schemas/RunFinished'}
    FileReceived:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [FileReceived]}
        occurred_at: {type: string, format: date-time}
    RunQueued:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [RunQueued]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
    AttemptStarted:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [AttemptStarted]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
    StepStarted:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, stage]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [StepStarted]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        stage: {type: string, enum: [source_validation, page_transcription, extraction, signature_detection, result_publishing]}
    StepFinished:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, stage]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [StepFinished]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        stage: {type: string, enum: [source_validation, page_transcription, extraction, signature_detection, result_publishing]}
        duration_ms: {type: number, minimum: 0}
    StepFailed:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, stage, error_code]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [StepFailed]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        stage: {type: string, enum: [source_validation, page_transcription, extraction, signature_detection, result_publishing]}
        duration_ms: {type: number, minimum: 0}
        error_code: {type: string, enum: [PIPELINE_CONFIG_CHANGED, SOURCE_HASH_MISMATCH, PROCESSING_FAILED, EXTRACTION_FAILED]}
    PageCacheReused:
      type: object
      description: Observed reuse of a stored page result; not a new completion, executed step or provider call in this attempt.
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, page_number, stage, cached_status]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [PageCacheReused]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        page_number: {type: integer, minimum: 1}
        stage: {type: string, enum: [page_transcription]}
        cached_status: {type: string, enum: [completed, failed], description: Stored cached result status; not business or latest page status.}
        cached_method: {type: string, enum: [native, vision], description: Known method of the cached result; omitted if unknown and does not imply current inference.}
        cached_model: {type: string, description: Known model of the cached result; omitted if unknown and does not imply a current provider call.}
        artifact_ids: {type: array, items: {type: string}, description: Known opaque artifact references only; no storage keys or content availability guarantee.}
    PageCompleted:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, page_number, stage]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [PageCompleted]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        page_number: {type: integer, minimum: 1}
        stage: {type: string, enum: [page_transcription]}
        duration_ms: {type: number, minimum: 0}
        method: {type: string}
        model: {type: string}
    PageFailed:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, page_number, stage, error_code]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [PageFailed]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        page_number: {type: integer, minimum: 1}
        stage: {type: string, enum: [page_transcription]}
        error_code: {type: string, minLength: 1}
    ResultPublished:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, result_status]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [ResultPublished]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        result_status: {type: string, enum: [completed, partial, failed]}
        artifact_ids: {type: array, items: {type: string}}
    RetryEnqueued:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [RetryEnqueued]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        reason_code: {type: string, enum: [RETRYABLE_FAILURE, RETRY_EXHAUSTED, PROCESSING_FAILED]}
    AttemptFinished:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, attempt_no, attempt_status]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [AttemptFinished]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        attempt_status: {type: string, enum: [completed, partial, failed]}
        duration_ms: {type: number, minimum: 0}
        error_code: {type: string, enum: [PROCESSING_FAILED]}
    RunFinished:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, run_id, run_status]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        event_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type: {type: string, enum: [RunFinished]}
        occurred_at: {type: string, format: date-time}
        run_id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        run_status: {type: string, enum: [completed, partial, failed]}
        error_code: {type: string, enum: [RETRY_EXHAUSTED, PROCESSING_FAILED]}
    DocumentEvent: {oneOf: [{$ref: '#/components/schemas/FileReceived'}, {$ref: '#/components/schemas/RunQueued'}, {$ref: '#/components/schemas/AttemptStarted'}, {$ref: '#/components/schemas/StepStarted'}, {$ref: '#/components/schemas/StepFinished'}, {$ref: '#/components/schemas/StepFailed'}, {$ref: '#/components/schemas/PageCacheReused'}, {$ref: '#/components/schemas/PageCompleted'}, {$ref: '#/components/schemas/PageFailed'}, {$ref: '#/components/schemas/ResultPublished'}, {$ref: '#/components/schemas/RetryEnqueued'}, {$ref: '#/components/schemas/AttemptFinished'}, {$ref: '#/components/schemas/RunFinished'}]}
    RunEvent: {oneOf: [{$ref: '#/components/schemas/RunQueued'}, {$ref: '#/components/schemas/AttemptStarted'}, {$ref: '#/components/schemas/StepStarted'}, {$ref: '#/components/schemas/StepFinished'}, {$ref: '#/components/schemas/StepFailed'}, {$ref: '#/components/schemas/PageCacheReused'}, {$ref: '#/components/schemas/PageCompleted'}, {$ref: '#/components/schemas/PageFailed'}, {$ref: '#/components/schemas/ResultPublished'}, {$ref: '#/components/schemas/RetryEnqueued'}, {$ref: '#/components/schemas/AttemptFinished'}, {$ref: '#/components/schemas/RunFinished'}]}
    AttemptObservation: {oneOf: [{$ref: '#/components/schemas/AttemptStarted'}]}
    StepObservation:
      oneOf:
        - {$ref: '#/components/schemas/SourceValidationStartedObservation'}
        - {$ref: '#/components/schemas/SourceValidationFinishedObservation'}
        - {$ref: '#/components/schemas/SourceValidationFailedObservation'}
        - {$ref: '#/components/schemas/ExtractionStartedObservation'}
        - {$ref: '#/components/schemas/ExtractionFinishedObservation'}
        - {$ref: '#/components/schemas/ExtractionFailedObservation'}
        - {$ref: '#/components/schemas/PageStartedObservation'}
        - {$ref: '#/components/schemas/PageCompletedObservation'}
        - {$ref: '#/components/schemas/PageFailedObservation'}
    SourceValidationStartedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no]
      properties: &sourceValidationFacts
        event_id: {type: string, minLength: 1}
        sequence: {type: integer, minimum: 0}
        occurred_at: {type: string, format: date-time}
        type: {type: string, enum: [StepStarted]}
        stage: {type: string, enum: [source_validation]}
        run_id: {type: string, minLength: 1}
        attempt_no: {type: integer, minimum: 1}
    SourceValidationFinishedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no]
      properties:
        <<: *sourceValidationFacts
        type: {type: string, enum: [StepFinished]}
        duration_ms: {type: number, minimum: 0}
    SourceValidationFailedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no, error_code]
      properties:
        <<: *sourceValidationFacts
        type: {type: string, enum: [StepFailed]}
        duration_ms: {type: number, minimum: 0}
        error_code: {type: string, enum: [PIPELINE_CONFIG_CHANGED, SOURCE_HASH_MISMATCH, SOURCE_VALIDATION_FAILED, EXTRACTION_FAILED, PAGE_TRANSCRIPTION_FAILED, RESULT_PUBLISHING_FAILED, SIGNATURE_DETECTION_FAILED]}
    ExtractionStartedObservation:
      type: object
      additionalProperties: false
      description: Observed extraction boundary only; not evidence of a model call or complete extracted fields.
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no]
      properties: &extractionFacts
        <<: *sourceValidationFacts
        stage: {type: string, enum: [extraction]}
    ExtractionFinishedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no]
      properties:
        <<: *extractionFacts
        type: {type: string, enum: [StepFinished]}
        duration_ms: {type: number, minimum: 0}
    ExtractionFailedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no, error_code]
      properties:
        <<: *extractionFacts
        type: {type: string, enum: [StepFailed]}
        duration_ms: {type: number, minimum: 0}
        error_code: {type: string, enum: [PIPELINE_CONFIG_CHANGED, SOURCE_HASH_MISMATCH, SOURCE_VALIDATION_FAILED, EXTRACTION_FAILED, PAGE_TRANSCRIPTION_FAILED, RESULT_PUBLISHING_FAILED, SIGNATURE_DETECTION_FAILED]}
    PageObservation:
      description: Partial observations in evaluated order, not chronological/latest state. Reuse preserves its own identity and cached result semantics without counting new work.
      oneOf:
        - {$ref: '#/components/schemas/PageStartedObservation'}
        - {$ref: '#/components/schemas/PageCompletedObservation'}
        - {$ref: '#/components/schemas/PageFailedObservation'}
        - {$ref: '#/components/schemas/PageCacheReusedObservation'}
    PageStartedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no, page_number]
      properties: &pageFacts
        event_id: {type: string, minLength: 1}
        sequence: {type: integer, minimum: 0}
        occurred_at: {type: string, format: date-time}
        type: {type: string, enum: [StepStarted]}
        stage: {type: string, enum: [page_transcription]}
        run_id: {type: string, minLength: 1}
        attempt_no: {type: integer, minimum: 1}
        page_number: {type: integer, minimum: 1}
    PageCompletedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no, page_number]
      properties:
        <<: *pageFacts
        type: {type: string, enum: [PageCompleted]}
        duration_ms: {type: number, minimum: 0}
        method: {type: string, enum: [native, vision]}
        model: {type: string, minLength: 1}
    PageFailedObservation:
      type: object
      additionalProperties: false
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no, page_number, error_code]
      properties:
        <<: *pageFacts
        type: {type: string, enum: [PageFailed]}
        duration_ms: {type: number, minimum: 0}
        method: {type: string, enum: [native, vision]}
        model: {type: string, minLength: 1}
        error_code: {type: string, enum: [PIPELINE_CONFIG_CHANGED, SOURCE_HASH_MISMATCH, SOURCE_VALIDATION_FAILED, EXTRACTION_FAILED, PAGE_TRANSCRIPTION_FAILED, RESULT_PUBLISHING_FAILED, SIGNATURE_DETECTION_FAILED]}
    PageCacheReusedObservation:
      type: object
      additionalProperties: false
      description: A reuse fragment needs no observed run/attempt start or original cache event. It is not a new inference or completed page.
      required: [event_id, sequence, occurred_at, type, stage, run_id, attempt_no, page_number, cached_status]
      properties:
        <<: *pageFacts
        type: {type: string, enum: [PageCacheReused]}
        cached_status: {type: string, enum: [completed, failed], description: Stored cached result status; not business or latest page status.}
        cached_method: {type: string, enum: [native, vision], description: Known cached method; omitted if unknown and not a current provider call.}
        cached_model: {type: string, minLength: 1, description: Known cached model; omitted if unknown and not a current provider call.}
        artifact_ids: {type: array, items: {type: string}, description: Known opaque references only; no internal storage keys or content.}
    RunSummary:
      type: object
      additionalProperties: false
      required: [run_id, state, evidence]
      properties:
        run_id: {type: string}
        state: {type: string, enum: [unknown, ambiguous, finished, completed, partial, failed]}
        evidence: {type: array, items: {$ref: '#/components/schemas/LifecycleEvidence'}}
    RunDetail:
      type: object
      additionalProperties: false
      required: [run_id, state, evidence, attempts, published_results]
      properties:
        run_id: {type: string}
        state: {type: string, enum: [unknown, ambiguous, finished, completed, partial, failed]}
        evidence: {type: array, items: {$ref: '#/components/schemas/LifecycleEvidence'}}
        attempts: {type: array, items: {$ref: '#/components/schemas/LifecycleAttempt'}}
        published_results: {type: array, items: {$ref: '#/components/schemas/LifecyclePublication'}}
    DocumentAudit:
      type: object
      additionalProperties: false
      required: [document_id, runs, attempts, published_results, unscoped_evidence, conflicts]
      properties:
        document_id: {type: string}
        runs: {type: array, items: {$ref: '#/components/schemas/RunSummary'}}
        attempts: {type: array, items: {$ref: '#/components/schemas/LifecycleAttempt'}}
        published_results: {type: array, items: {$ref: '#/components/schemas/LifecyclePublication'}}
        unscoped_evidence: {type: array, items: {$ref: '#/components/schemas/LifecycleEvidence'}}
        conflicts: {type: array, items: {type: object, additionalProperties: false, required: [evidence], properties: {evidence: {type: array, items: {$ref: '#/components/schemas/LifecycleEvidence'}}}}}
    LifecycleEvidence:
      type: object
      additionalProperties: false
      required: [event_id, sequence, event_type]
      properties:
        event_id: {type: string}
        sequence: {type: integer}
        event_type: {type: string}
    LifecycleAttempt:
      type: object
      additionalProperties: false
      required: [run_id, attempt_id, attempt_number, terminal_state, evidence]
      properties:
        run_id: {type: string}
        attempt_id: {type: integer}
        attempt_number: {type: integer}
        terminal_state: {type: string, enum: [unknown, ambiguous, finished, completed, partial, failed]}
        evidence: {type: array, items: {$ref: '#/components/schemas/LifecycleEvidence'}}
    LifecyclePublication:
      type: object
      additionalProperties: false
      required: [run_id, publication_id, evidence]
      properties:
        run_id: {type: string, nullable: true}
        publication_id: {type: string}
        evidence: {type: array, items: {$ref: '#/components/schemas/LifecycleEvidence'}}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties: {error: {type: string}}
