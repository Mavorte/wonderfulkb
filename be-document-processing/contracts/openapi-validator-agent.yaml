openapi: 3.0.3
info:
  title: wonderfulkb API (klienti, case, dokumenty pro validačního agenta)
  version: 0.6.0
  description: |
    Jedno API (Lambda `wonderfulkb-agent-api`, HTTP API, stage `v1`) pro klienty a case (dříve samostatné
    Case & Client API, Lambda `wonderfulkb-case-client`, smazaná 19. 10. 2026) a pro vstupy, kterými Wonderful
    vyhodnocovací (validační) agent posuzuje case. Nasazená adresa (`<AGENT_API_BASE_URL>`) se předává mimo
    repozitář. Kód: `be-validator-agent/api`.
    Nahrání dokumentů je dál v Ingest API (`be-intake/openapi-ingest.yaml`). Všechna volání chrání stejný klíč
    `x-api-key` jako Ingest API (Secrets Manager `wonderfulkb/ingest-api-key`).

    ## Na co se agent může ptát

    | Otázka agenta | Volání (`operationId`) |
    |---|---|
    | Jaké case existují a komu patří? | `listCases`, `getCase`, `listClients`, `listClientCases` |
    | Jaké dokumenty case obsahuje a jsou zpracované? | `listCaseDocuments` |
    | Jaký je typ, popis a celý text dokumentu? | `getDocumentForValidation` |
    | Je dokument opravdu to, za co se vydává? Jaké ověřené dokumenty se mu podobají? | `getDocumentVectors` (`similar_to_verified`) |
    | Jsou na dokumentu podpisy, čí jsou, nejsou to kopie? | `getDocumentSignatures` |
    | Ukázat člověku čitelný podpis (jen lidská kontrola, auditováno) | `revealSignatureImage` |
    | Zobrazit dokument po stranách se zamaskovanými podpisy (např. vyznačit `bbox` na straně) | `getDocumentPages` |
    | Ukázat člověku čitelný originál dokumentu (jen lidská kontrola, auditováno) | `revealDocumentOriginal` |
    | Kde v dokumentu je ustanovení, položka nebo řádek, na který nález ukazuje (text, strana, `bbox`, štítek)? | `getDocumentRegions`, `getCaseRegions` |

    ## Doporučený postup agenta

    1. `listCaseDocuments` → seznam `document_id`; zpracovávat jen `processing_status` = `completed` nebo `partial`.
    2. Pro každý dokument `getDocumentForValidation`. Text a štítek potřebuje agent vždy.
    3. `getDocumentVectors` **jen když pravidlo vyžaduje srovnání** (typ dokumentu, podobnost s ověřenými). Vždy s
       `include_values=false&similar_to_verified=N`, surové vektory (desítky kB) do kontextu LLM nepatří.
    4. `getDocumentSignatures` jen u pravidel na podpisy. Pro srovnání s klientovými podpisy `match_client=true`,
       `include_vectors=false`.

    ## Jak ukázat dokument člověku (UI, ne agent)

    Tři úrovně. Agent sám žádnou z nich nepotřebuje, slouží člověku, který nález kontroluje:

    | Úroveň | Volání | Co člověk vidí | Audit |
    |---|---|---|---|
    | Náhled dokumentu | `getDocumentPages` | strany PNG a PDF zamaskované kopie: podpisy **začerněné**, zbytek čitelný | ne |
    | Náhled podpisu | `preview_url` z `getDocumentSignatures` | **zkreslený** výřez podpisu, nejde přečíst | ne |
    | Odkrytí podpisu | `revealSignatureImage` (`reveal_path` podpisu) | čitelný výřez jednoho podpisu (PNG) | ano, `signature_reveal` |
    | Odkrytí originálu | `revealDocumentOriginal` (`reveal_path` z `getDocumentPages`) | celý původní soubor s čitelnými podpisy | ano, `document_reveal` |

    Postup v UI: `getDocumentPages` → zobrazit stranu (`pages[].preview_url`) → přes ni vyznačit `bbox` podpisu nebo
    regionu (`[x0, y0, x1, y1]`, 0–1, počátek vlevo nahoře, tedy `left = x0·100 %`, `top = y0·100 %`,
    `width = (x1−x0)·100 %`, `height = (y1−y0)·100 %`) → odkrytí (podpisu nebo originálu) jen na výslovnou akci
    člověka (tlačítko „odkrýt“). Odkrytí se zapisuje do auditního logu (kdo podle ID nebo otisku klíče, kdy, case,
    dokument, podpis, výsledek), nikdy obsah, odkaz ani klíč. Předpodepsané odkazy neukládat; po vypršení zavolat znovu.
    Odkrytý obsah do kontextu LLM nepatří.

    ## Co API neslibuje (agent s tím musí počítat)

    - **Pravost podpisu se neověřuje.** Výstup je „přítomnost, přiřazená role, podezření na kopii".
    - `detection_score` podpisu **není kalibrovaná pravděpodobnost**, nepoužívat jako práh rozhodnutí;
      nízké skóre jen zvyšuje prioritu pro člověka.
    - `label` s `label_status: predicted` je strojový odhad, ne ověřený fakt. `confidence` je jistota klasifikace
      štítku, ne jistota přepisu textu.
    - Prázdné pole (`signatures: []`, `text_vectors: []`) je platná odpověď „nic není", ne chyba. U vektorů
      znamená, že ještě nevznikly; u podpisů, že žádný nebyl nalezen.
    - Podobnost vektorů je nápověda, ne důkaz. Obecný embedding není model pro ověřování podpisů.

    ## Chyby

    Vždy `{"error": "popis"}` (u `/clients` a `/cases` anglicky, u dokumentů česky). `400` neplatný parametr, `401` chybí API klíč (hlavička `x-api-key` chybí nebo je prázdná), `403` špatný API klíč (jako Ingest API), `404` neexistující case,
    dokument nebo klient, `409` OCR ještě nedoběhlo (`getDocumentForValidation`, `getDocumentPages`; v těle `processing_status`; u `revealSignatureImage` výřez není zašifrovaný), `405` jiná metoda než `GET` u cest dokumentů, `5xx` chyba služby (volání je idempotentní,
    lze opakovat; `createCase` idempotentní není). `429` při překročení limitu HTTP API (10 req/s, burst 20).
servers:
  - url: https://{host}/v1
    variables:
      host:
        default: REPLACE_WITH_HOST
security:
  - ApiKeyAuth: []
tags:
  - name: clients
    description: Klienti (jen čtení, syntetická data)
  - name: cases
    description: Case klientů (založení a čtení)
  - name: document
    description: Seznam dokumentů case, jejich text, typ a popis
  - name: vectors
    description: Vektory textu a obrazu, nejbližší ověřené dokumenty (S3 Vectors)
  - name: signatures
    description: Podpisy nalezené v dokumentu, jejich role, podezření na kopii, zkreslený náhled a odkrytí výřezu
  - name: view
    description: Zobrazení dokumentu člověku – stránky zamaskované kopie (náhled) a čitelný originál (odkrytí, auditováno)
  - name: regions
    description: Regiony dokumentu (odstavce, položky výčtu, řádky tabulek) s polohou, textem a štítkem, na které nález ukazuje

paths:
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: Vylistuje klienty (s volitelným filtrem)
      description: |
        Bez filtrů vrací všechny klienty stránkovaně (Scan, pořadí není garantováno). Filtry se kombinují (AND).
        Jen pro čtení, databáze klientů obsahuje syntetická data.
      parameters:
        - name: ico
          in: query
          description: Přesná shoda IČO.
          schema: {type: string, pattern: '^[0-9]{8}$'}
        - name: name
          in: query
          description: Část názvu, bez ohledu na velikost písmen, diakritiku a právní formu.
          schema: {type: string, minLength: 2, maxLength: 255}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ClientStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Stránka klientů (může být prázdná)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /clients/{client_id}/cases:
    get:
      tags: [cases]
      operationId: listClientCases
      summary: Vylistuje case klienta
      description: Řazeno od nejnovějšího. Klient musí existovat (jinak 404); klient bez case vrací prázdné pole.
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CaseStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Stránka case klienta (může být prázdná)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientCaseList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'Klient neexistuje (`{"error": "Client not found"}`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: Vylistuje case napříč klienty
      description: Globální stránkovaný Scan; pořadí není garantováno a klienti se neověřují.
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CaseStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Stránka case
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [cases]
      operationId: createCase
      summary: Založí case pro aktivního klienta
      description: |
        `case_id` přidělí služba (UUID v4) a vrátí ho v odpovědi; v požadavku se neposílá (případné se ignoruje).
        Volání není idempotentní, každé založí nový case. Údaje pro frontend (číslo smlouvy, předmět) patří do
        `metadata` (nejvýš 16 KiB JSON).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCaseRequest'}
            example:
              client_id: 4727210c-8eb4-57fc-b223-6cea0072f143
              metadata: {loan_agreement_no: "170170/25", asset_name: Epiroc CC 3100 demolition shears}
      responses:
        '201':
          description: Case založen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Klient `client_id` neexistuje
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Klient není `active` (`inactive`/`blocked`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /cases/{case_id}:
    get:
      tags: [cases]
      operationId: getCase
      summary: Vrátí case podle case_id
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                client_id: 4727210c-8eb4-57fc-b223-6cea0072f143
                status: open
                created_at: '2026-10-19T19:01:35.412910Z'
                metadata: {client_name: Zervanta Stavby a.s., ico: '98001418'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'Case neexistuje (`{"error": "Case not found"}`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /cases/{case_id}/documents:
    get:
      tags: [document]
      operationId: listCaseDocuments
      summary: Seznam dokumentů case (vstupní bod agenta)
      description: |
        Vrací stručný přehled všech dokumentů case bez textu. Slouží ke zjištění `document_id` a stavu zpracování.
        Obsahuje i dokumenty nahrané přes Ingest API, které pipeline ještě nezpracovala: mají
        `processing_status: queued`, `title` = název nahraného souboru, `label` a `page_count` `null`.
        Dokumenty ve stavu `awaiting_upload`, `queued`, `processing` nebo `failed` zatím nemají text; jejich
        detailní volání vrací `409`. Řazeno podle `document_id`, stránkované. `404` jen když case neexistuje
        v tabulce case a nemá žádný dokument; existující case bez dokumentů vrací prázdný seznam.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: next_token
          in: query
          description: Neprůhlivý token z předchozí odpovědi.
          schema: {type: string}
        - name: processing_status
          in: query
          description: Vrátí jen dokumenty v daném stavu (např. `completed`).
          schema: {$ref: '#/components/schemas/ProcessingStatus'}
      responses:
        '200':
          description: Dokumenty case
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseDocumentList'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                documents:
                  - document_id: d2f4a1
                    title: 0_Form_Smlouva.pdf
                    label: smlouva_o_uveru
                    label_status: verified
                    processing_status: completed
                    page_count: 4
                  - document_id: e9b7c2
                    title: 11_Protokol.pdf
                    label: null
                    label_status: null
                    processing_status: processing
                    page_count: null
                next_token: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /cases/{case_id}/documents/{document_id}:
    get:
      tags: [document]
      operationId: getDocumentForValidation
      summary: Text, štítek, popis a jistota dokumentu
      description: |
        Základní vstup pro každé pravidlo: celý přepis dokumentu, typ (`label`), krátký popis a jistota klasifikace.
        Volat pro každý dokument case. Pro `partial` vrací text úspěšně přečtených stran a v `pages_failed` seznam
        stran, které chybí; pravidlo, které potřebuje chybějící stranu, nesmí z mlčení usuzovat, že v ní nic není.

        **Duplicity napříč případy.** `duplicate_of` vypisuje dokumenty v JINÝCH případech se stejným obsahem (SHA-256
        souboru), `duplicate_relevant` říká, zda je to podezřelé („stejný doklad použit ve dvou financováních“).
        Pravidlo má číst `duplicate_relevant`, ne jen délku `duplicate_of`: `true` je jen u individuálních dokumentů
        (faktura, protokol, objednávka, doklad o úhradě, vyplněné formuláře). Standardní text, který je legitimně stejný
        ve všech případech (VOP), a obsah, který leží ve 3 a více různých případech (práh šablony), je `false`.
        Obě pole se **vynechají**, když se index duplicit nepodařilo přečíst nebo o dokumentu nic neví; chybějící pole
        neznamená „bez duplicity“ a volání kvůli tomu neselže.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Dokument
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationDocument'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                document_id: d2f4a1
                title: 0_Form_Smlouva.pdf
                label: smlouva_o_uveru
                label_status: predicted
                description: Smlouva o úvěru č. 170170/25 mezi bankou a Stavby Fišer s.r.o.
                text: "SMLOUVA O ÚVĚRU …\fStrana 2 …"
                confidence: 0.93
                page_count: 4
                processing_status: completed
                duplicate_of:
                  - {case_id: 170170-25, document_id: 6f1c2e0d-7a11-5d3f-9b36-0a524a8b7c1e, label: faktura}
                duplicate_relevant: true
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: OCR ještě nedoběhlo (nebo selhalo); dokument jen nahraný v Ingest API vrací `processing_status` `queued`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotReady'}
              example:
                error: OCR ještě nedoběhlo
                processing_status: processing

  /cases/{case_id}/documents/{document_id}/vectors:
    get:
      tags: [vectors]
      operationId: getDocumentVectors
      summary: Vektory textu a obrazu dokumentu a jeho nejbližší ověřené dokumenty (S3 Vectors)
      description: |
        Text je rozdělen na části (jeden vektor na `chunk`), obraz má jeden vektor na stránku. Všechny mají
        1024 dimenzí, metrika kosinus. Vektory různých modelů a verzí se nemíchají (`model`, `model_version`).

        **Pro agenta:** použít `include_values=false` a `similar_to_verified=N`. Výsledek `neighbors` říká, které
        ověřené dokumenty se zkoumanému nejvíc podobají (`label` a `score`); to slouží k ověření typu dokumentu
        (štítek dokumentu vs. štítky sousedů). `score` je kosinová podobnost 0 až 1, vysoká hodnota u sousedů jiného
        typu je signál ke kontrole člověkem, ne důkaz.
        Dokument bez vektorů vrací prázdná pole a `200`, ne chybu.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
        - name: include
          in: query
          description: Omezí odpověď na jeden typ vektorů. Bez parametru se vrací oba.
          schema: {type: string, enum: [text, image]}
        - name: include_values
          in: query
          description: Pokud je `false`, vrátí jen metadata vektorů (model, verze, část/strana) bez čísel. Doporučeno pro agenta.
          schema: {type: boolean, default: true}
        - name: similar_to_verified
          in: query
          description: Vrátí navíc `neighbors`, tj. N nejbližších ověřených dokumentů (filtr `verified = true`).
          schema: {type: integer, minimum: 1, maximum: 20}
      responses:
        '200':
          description: Vektory dokumentu; chybějící vektory jsou prázdné pole
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentVectors'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                document_id: d2f4a1
                text_vectors:
                  - chunk_id: c0
                    page_from: 1
                    page_to: 2
                    model: amazon.titan-embed-text-v2:0
                    model_version: v2
                    dimension: 1024
                image_vectors:
                  - page: 1
                    model: amazon.titan-embed-image-v1
                    model_version: v1
                    dimension: 1024
                neighbors:
                  - {document_id: a17c33, label: smlouva_o_uveru, score: 0.91}
                  - {document_id: b2e801, label: smlouva_o_uveru, score: 0.88}
                  - {document_id: 0c5d19, label: zadost_o_uver, score: 0.54}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /cases/{case_id}/documents/{document_id}/signatures:
    get:
      tags: [signatures]
      operationId: getDocumentSignatures
      summary: Nalezené podpisy dokumentu, přiřazená role, podezření na kopii (nepotvrzuje pravost)
      description: |
        Každý nález má stranu, polohu (`bbox`), přiřazenou roli (podle nejbližšího textu, např. „Za dlužníka")
        a odkazy pro lidskou kontrolu: `preview_url` (zkreslený náhled, podpis z něj nejde přečíst) a `reveal_path`
        (cesta, na které se čitelný výřez po odkrytí vydá, viz `revealSignatureImage`). Nález se vždy odkazuje na stranu
        a výřez. Nový (šifrovaný) výřez se nevrací čitelným odkazem (dříve `crop_url`). Dočasně do migrace mají
        starší nezmigrované čitelné výřezy ještě `crop_url` (nasazení s `LEGACY_PLAIN_CROP_URL=true`).

        **Jak číst výsledek:**
        - `signatures: []` = žádný podpis nenalezen (pravidlo „podpis chybí" ho musí rozlišit od chyby `5xx`).
        - `role` je `unknown`, nebo `null`, pokud se k podpisu nenašel dostatečně blízký text; pravidlo na roli pak
          musí nález poslat člověku.
        - `copy_suspicion.level = suspected` znamená, že v jiném dokumentu je téměř identický podpis (perceptuální
          hash / pixelové porovnání). Skutečné podpisy se vždy trochu liší; přesná shoda může být vložený obrázek.
        - `similar_signatures` (jen s `match_client=true`) je nápověda pro člověka, ne ověření pravosti.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
        - name: match_client
          in: query
          description: U každého podpisu vrátí `similar_signatures[]`, nejbližší podpisy téhož klienta (podobnost, ne ověření pravosti).
          schema: {type: boolean, default: false}
        - name: include_vectors
          in: query
          description: Zahrnout samotné hodnoty vektoru. Výchozí je ano; agent má vypnout a použít jen `similar_signatures` a `copy_suspicion`.
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Podpisy dokumentu; bez podpisu je `signatures` prázdné pole
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentSignatures'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                document_id: d2f4a1
                signatures:
                  - signature_id: sig_01
                    page: 4
                    bbox: [0.12, 0.71, 0.38, 0.79]
                    detector: textract
                    detection_score: 65.6
                    role: borrower
                    role_source: nearest_text
                    role_evidence: Za dlužníka
                    preview_url: https://example.invalid/preview/sig_01.preview.png
                    reveal_path: /cases/7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90/documents/d2f4a1/signatures/sig_01/image
                    crop_available: true
                    phash: c3a1e07b5d2f9a44
                    copy_suspicion:
                      level: suspected
                      matches:
                        - {signature_id: sig_02, document_id: e9b7c2, score: 0.99}
                    similar_signatures: []
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /cases/{case_id}/documents/{document_id}/signatures/{signature_id}/image:
    get:
      tags: [signatures]
      operationId: revealSignatureImage
      summary: Čitelný výřez podpisu (odkrytí na vyžádání, auditováno)
      description: |
        Vrátí dešifrovaný PNG výřezu. Určeno pro lidskou kontrolu (člověk, který rozhoduje o nálezu), **ne pro kontext
        LLM**: agent pracuje s `preview_url`, `role` a `copy_suspicion` a obrázek si nestahuje.

        - Čitelný podpis se nikde neukládá; výřez je v úložišti šifrovaný a tady se dešifruje při každém volání.
          Odpověď má `Cache-Control: no-store`, `Content-Disposition: inline` a nelze ji uložit do mezipaměti.
        - Každé volání s platným API klíčem (i neúspěšné) se zapíše do auditního logu: identifikátor volajícího (ID API klíče nebo jeho
          otisk, nikdy hodnota klíče), čas, case, dokument, podpis a výsledek. Obraz do logu nejde.
        - Čitelný náhradní výřez neexistuje: výřez, který ještě není šifrovaný, se nevrací (`409`).
        - Odkaz na tuto cestu se nepředpodepisuje; volá se s `x-api-key` jako ostatní cesty. Cesta je v poli
          `reveal_path` podpisu (relativně k adrese serveru).
        - Pro neznámý nebo nezpracovaný dokument, neexistující podpis nebo chybějící výřez je `404`.
        - Auditní záznam (`event: signature_reveal`) má `outcome`: `revealed` (200), `not_found` (404),
          `not_encrypted` (409), `denied` (dešifrování odmítnuto, navenek 500), `error` (jiná chyba).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
        - name: signature_id
          in: path
          required: true
          description: '`signature_id` z volání `getDocumentSignatures` (např. `sig_01`)'
          schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
      responses:
        '200':
          description: PNG výřezu podpisu
          headers:
            Cache-Control:
              description: Vždy `no-store`
              schema: {type: string, example: no-store}
            Content-Disposition:
              schema: {type: string, example: inline}
          content:
            image/png:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Výřez ještě není zašifrovaný (starý čitelný objekt čeká na migraci); odkrytí není možné a čitelný výřez se nevrací
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Výřez nejde odkrýt (poškozený blok, zamítnutí KMS) nebo je výstup zpracování neplatný; podrobnosti jsou jen v logu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /cases/{case_id}/documents/{document_id}/pages:
    get:
      tags: [view]
      operationId: getDocumentPages
      summary: Náhled dokumentu po stranách (zamaskovaná kopie, bez auditu)
      description: |
        Obdoba `preview_url` u podpisů pro celý dokument. Vrací předpodepsané odkazy (300 s) na stránky PNG a na PDF
        **zamaskované kopie**: podpisy jsou začerněné, zbytek dokumentu čitelný. Hodí se pro UI, které má na straně
        vyznačit oblast (`bbox` podpisu nebo regionu): `bbox` je `[x0, y0, x1, y1]` relativně ke straně (0–1, počátek
        vlevo nahoře), stránka PNG je celá strana, takže obdélník jde nad `<img>` umístit v procentech.

        - Dokument zpracovaný před zavedením maskování (`redacted: false`) náhled nemá (`preview_url: null`), protože
          jeho stránky vznikly z čitelného originálu. Zbývá `revealDocumentOriginal`.
        - I při `redacted: true` může mít jednotlivá strana `preview_url: null` (obrázek strany chybí) a
          `preview_pdf_url` může být `null` (soubor zamaskované kopie chybí). UI má počítat s oběma případy.
        - `pages` má vždy `page_count` položek očíslovaných od 1, takže index strany sedí s `page` u podpisů a regionů.
        - Odkazy vyprší; pro nové stačí volání zopakovat. Volání se neaudituje (nic čitelného nevydává).
        - Čitelný originál se odsud nikdy nevrací, jen cesta `reveal_path` a příznak `original_available`.
        - Vyžaduje dokončené zpracování (`completed` nebo `partial`), jinak `409` jako `getDocumentForValidation`;
          dokument jen nahraný v Ingest API dává `409` s `processing_status: queued`.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Strany dokumentu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPages'}
              examples:
                redacted:
                  summary: Zamaskovaná kopie existuje
                  value:
                    case_id: 3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47
                    document_id: 8e41d2a9-0c6b-5f37-a1d4-92b7e3c58f10
                    page_count: 2
                    redacted: true
                    preview_pdf_url: https://wonderfulkb-raw-document-storage.s3.eu-central-1.amazonaws.com/cases/…/redacted/….pdf?X-Amz-…
                    pages:
                      - {page: 1, preview_url: 'https://…/analysis/…/pages/1.png?X-Amz-…'}
                      - {page: 2, preview_url: 'https://…/analysis/…/pages/2.png?X-Amz-…'}
                    original_available: true
                    reveal_path: /cases/3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47/documents/8e41d2a9-0c6b-5f37-a1d4-92b7e3c58f10/original
                legacy:
                  summary: Dokument zpracovaný před zavedením maskování (zbývá jen odkrytí originálu)
                  value:
                    case_id: 3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47
                    document_id: 1c7d0e52-9b3a-5e14-8f60-2a4b6c8d0e1f
                    page_count: 2
                    redacted: false
                    preview_pdf_url: null
                    pages:
                      - {page: 1, preview_url: null}
                      - {page: 2, preview_url: null}
                    original_available: true
                    reveal_path: /cases/3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47/documents/1c7d0e52-9b3a-5e14-8f60-2a4b6c8d0e1f/original
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Dokument se ještě zpracovává nebo zpracování selhalo (`processing_status` v těle chyby); dokument jen nahraný v Ingest API vrací `queued`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotReady'}
              example:
                error: OCR ještě nedoběhlo
                processing_status: queued

  /cases/{case_id}/documents/{document_id}/original:
    get:
      tags: [view]
      operationId: revealDocumentOriginal
      summary: Čitelný originál dokumentu (odkrytí na vyžádání, auditováno)
      description: |
        Vrátí předpodepsaný odkaz platný **60 s** na původní nahraný soubor (s čitelnými podpisy). Určeno pro lidskou
        kontrolu, **ne pro kontext LLM**. Soubor se nevrací v těle (PDF mají až desítky MB); odkaz otevři hned
        (`<iframe>`, PDF.js, nové okno). Odkaz posílá `Content-Disposition: inline` s původním názvem souboru.

        - Každé volání s platným API klíčem (i neúspěšné) se zapíše do auditního logu (`event: document_reveal`):
          volající (ID nebo otisk klíče), čas, case, dokument, `outcome` (`revealed` 200, `not_found` 404, `error`
          jiná chyba). Odkaz do logu nejde. Audit zaznamená vydání odkazu, ne jeho stažení.
        - Funguje i pro dokument, který se ještě zpracovává (stačí, že byl nahrán).
        - `content_type` a `filename` jsou z nahrání (Ingest API), takže originál nemusí být PDF (např. `image/jpeg`).
        - `bbox` z podpisů a regionů platí i pro originál (stejná strana, relativní souřadnice).
        - `pages`: čitelné stránky jako PNG (`original-pages/<doc>/<n>.png`), vykreslené stejně jako zamaskované
          `pages[].preview_url` z `getDocumentPages`, takže na ně jde položit tytéž `bbox`. Odkazy platí také 60 s
          a patří k témuž auditovanému odkrytí. Stránka ještě nevykreslená (dokument se zpracovává, starší dokument
          bez dávkového dovykreslení) má `url: null`.
        - Cesta je v `reveal_path` z `getDocumentPages`; `original_available: false` tam předem říká, že tady bude `404`.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Krátkodobý odkaz na originál
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentOriginal'}
              example:
                case_id: 3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47
                document_id: 8e41d2a9-0c6b-5f37-a1d4-92b7e3c58f10
                filename: 0_F_Smlouva.pdf
                content_type: application/pdf
                url: https://wonderfulkb-raw-document-storage.s3.eu-central-1.amazonaws.com/cases/…/original/….pdf?response-content-disposition=inline…&X-Amz-Expires=60&X-Amz-…
                expires_in: 60
                pages:
                  - {page: 1, url: 'https://…/cases/…/original-pages/…/1.png?X-Amz-Expires=60&X-Amz-…'}
                  - {page: 2, url: 'https://…/cases/…/original-pages/…/2.png?X-Amz-Expires=60&X-Amz-…'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Dokument nebo jeho originál neexistuje
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error: Originál dokumentu neexistuje
        '500':
          description: 'Chyba služby (odkaz nejde vydat); v auditu `outcome: error`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /cases/{case_id}/regions:
    get:
      tags: [regions]
      operationId: getCaseRegions
      summary: Regiony napříč všemi dokumenty case podle štítku, strany nebo textu
      description: |
        Pro porovnání a hledání v celém case: „dodavatel ve všech dokumentech“ (`label=smluvni_strana&party=supplier`),
        „co smlouva vyžaduje doložit“ (`label=povinny_podklad`), „kde je výrobní číslo“ (`q=VV2600000005`). Každý region
        nese `document_id` a `title` svého dokumentu, takže nález může ukázat na dva regiony ve dvou dokumentech.

        **Pro agenta:** cituj `region_id` + `document_id` a doslovný citát z `text`; souřadnice neposílej, UI si je
        vezme z `getDocumentRegions`. Štítek je odhad (model, záloha regexy): „žádný region se štítkem X“ neznamená,
        že informace v dokumentu není; projdi `outline` dokumentu nebo filtruj přes `q`.
        `documents_without_regions` vyjmenuje dokumenty, které regiony nemají (nezpracované, skeny bez textové vrstvy,
        chyba): pro ně prázdný výsledek nic netvrdí.

        Vyžaduje aspoň jeden z filtrů `label`, `party`, `kind`, `q` (jinak 400). Bez `include_geometry=true` se
        souřadnice nevracejí.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/RegionLabel'
        - $ref: '#/components/parameters/RegionParty'
        - $ref: '#/components/parameters/RegionKind'
        - $ref: '#/components/parameters/RegionQuery'
        - $ref: '#/components/parameters/RegionOutline'
        - name: include_geometry
          in: query
          description: Přidat `bbox` a `lines` (pro UI). Výchozí ne.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Nalezené regiony
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseRegions'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                regions:
                  - {document_id: d2f4a1, title: 00_Smlouva_o_uveru.pdf, document_label: smlouva_o_uveru,
                     region_id: p1-r18, page: 1, kind: table_row, label: smluvni_strana, party: supplier,
                     summary: Identifikace dodavatele stroje., section: p1-r14,
                     text: "Dodavatel | Valdorin Stroje s.r.o."}
                  - {document_id: e9b7c2, title: 10_Objednavka.pdf, document_label: objednavka,
                     region_id: p1-r11, page: 1, kind: table_row, label: smluvni_strana, party: supplier,
                     summary: Identifikace dodavatele a prodávajícího., section: p1-r04,
                     text: "Dodavatel / prodávající | Valdorin Stroje s.r.o."}
                documents_without_regions:
                  - {document_id: 0c5d19, title: 11_Protokol.pdf, status: not_run}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /cases/{case_id}/documents/{document_id}/regions:
    get:
      tags: [regions]
      operationId: getDocumentRegions
      summary: Regiony dokumentu – přehled, vybrané regiony nebo vše s polohou
      description: |
        Dokument rozřezaný na regiony (odstavce, položky výčtu a), b)…, řádky tabulek, nadpisy). Každý má `region_id`
        (`p{strana}-r{pořadí}`, stabilní pro stejný obsah), stranu, text a štítek; s geometrií navíc `bbox`
        (`[x0, y0, x1, y1]`, 0–1, počátek vlevo nahoře, stejně jako u podpisů a stránek z `getDocumentPages`) a `lines`
        (řádky s rozsahem znaků v `text`, pro zúžení obdélníku na citát).

        **Pro agenta:** nejdřív `outline=true` (id, štítek, strana smlouvy, popis, začátek textu; levné), pak plný text
        jen vybraných regionů přes `ids=` s `include_geometry=false`. Nález cituje `region_id` a doslovný citát.

        **Pro UI:** bez parametrů (vše s geometrií) a obdélník nad stránku z `getDocumentPages` v procentech.

        `status`: `completed` = regiony jsou; `not_run` = dokument se na regiony nezpracoval (prázdné pole NENÍ
        důkaz, že v dokumentu nic není); `failed` = soubor regionů je poškozený; `not_ready` = dokument se ještě
        zpracovává (`processing_status`). Strany skenu bez textové vrstvy jsou v `pages` se `source: no_text_layer`
        a regiony zatím nemají.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RegionOutline'
        - name: ids
          in: query
          description: Jen tyto regiony (čárkami, nejvýš 200); neznámá id jsou v `missing_ids`
          schema: {type: string, example: 'p2-r19,p4-r09'}
        - name: page
          in: query
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/RegionLabel'
        - $ref: '#/components/parameters/RegionParty'
        - $ref: '#/components/parameters/RegionKind'
        - $ref: '#/components/parameters/RegionQuery'
        - name: include_geometry
          in: query
          description: Přidat `bbox` a `lines`. Výchozí ano; agent má vypnout. S `outline=true` se geometrie nevrací.
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Regiony dokumentu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentRegions'}
              example:
                case_id: 7b0e5c1a-3f42-4d8e-9a61-2c5d8e4f1b90
                document_id: d2f4a1
                title: 00_Smlouva_o_uveru.pdf
                document_label: smlouva_o_uveru
                status: completed
                pages: [{page: 1, width: 595.3, height: 841.9, source: text_layer}]
                regions:
                  - region_id: p2-r19
                    page: 2
                    kind: paragraph
                    label: povinny_podklad
                    refers_to: [faktura, objednavka, predavaci_protokol, uhrada_kupni_ceny]
                    summary: Seznam povinných podkladů před čerpáním.
                    section: p2-r15
                    text: "Před čerpáním musí být doložena faktura, potvrzená objednávka, předání stroje, …"
                    bbox: [0.0672, 0.5131, 0.9328, 0.5612]
                    lines: [{bbox: [0.0672, 0.5131, 0.93, 0.5258], start: 0, end: 98}]
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Dokument je jen v ingestu, zpracování ještě nezačalo (`processing_status` v těle chyby)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotReady'}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    ClientId:
      name: client_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    NextToken:
      name: next_token
      in: query
      description: Hodnota `next_token` z předchozí odpovědi (neprůhledná).
      schema: {type: string}
    CaseId:
      name: case_id
      in: path
      required: true
      description: UUID case z `POST /cases`
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Identifikátor dokumentu, stejný jako `blob_id` z uploadu (Ingest API) a `document_id` ze seznamu
      schema: {type: string}
    RegionLabel:
      name: label
      in: query
      description: |
        Štítek regionu, víc hodnot čárkami: `povinny_podklad`, `odkaz_na_dokument`, `smluvni_strana`, `predmet`,
        `cena_platba`, `zajisteni`, `predani`, `termin_misto`, `hlavicka`, `podpisovy_blok`, `obecne_ustanoveni`, `jine`
      schema: {type: string, example: smluvni_strana}
    RegionParty:
      name: party
      in: query
      description: Strana smlouvy (u `smluvni_strana` a `podpisovy_blok`), víc hodnot čárkami
      schema: {type: string, example: supplier}
    RegionKind:
      name: kind
      in: query
      description: Druh regionu, víc hodnot čárkami (`paragraph`, `list_item`, `table_row`, `heading`, `page_header`, `page_footer`)
      schema: {type: string}
    RegionQuery:
      name: q
      in: query
      description: Hledaný text v regionu (bez ohledu na diakritiku a velikost písmen), 1–200 znaků
      schema: {type: string, example: VV2600000005}
    RegionOutline:
      name: outline
      in: query
      description: Přehled bez textu a souřadnic (`excerpt` = prvních 80 znaků textu)
      schema: {type: boolean, default: false}
  responses:
    BadRequest:
      description: Neplatný parametr (case_id, limit, next_token, hodnota filtru)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Chybí API klíč (hlavička `x-api-key` chybí nebo je prázdná)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Špatný API klíč
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Case, dokument nebo klient neexistuje
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    DocumentPages:
      type: object
      required: [case_id, document_id, page_count, redacted, preview_pdf_url, pages, original_available, reveal_path]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        page_count: {type: integer, minimum: 0}
        redacted:
          type: boolean
          description: '`true` = existuje zamaskovaná kopie a stránky náhledu vznikly z ní'
        preview_pdf_url:
          type: string
          nullable: true
          description: Předpodepsaný odkaz (300 s) na PDF zamaskované kopie; `null` bez kopie
        pages:
          type: array
          items:
            type: object
            required: [page, preview_url]
            properties:
              page: {type: integer, minimum: 1, description: 'Číslo strany od 1 (jako `page` u podpisů a regionů)'}
              preview_url:
                type: string
                nullable: true
                description: Předpodepsaný odkaz (300 s) na PNG zamaskované strany; `null`, když strana nemá náhled
        original_available:
          type: boolean
          description: '`true` = originál existuje a `reveal_path` vrátí odkaz'
        reveal_path:
          type: string
          description: 'Cesta `revealDocumentOriginal`, relativní k adrese serveru: `/cases/{case_id}/documents/{document_id}/original`'
      example:
        case_id: 3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47
        document_id: 8e41d2a9-0c6b-5f37-a1d4-92b7e3c58f10
        page_count: 2
        redacted: true
        preview_pdf_url: https://wonderfulkb-raw-document-storage.s3.eu-central-1.amazonaws.com/cases/…/redacted/….pdf?X-Amz-…
        pages:
          - {page: 1, preview_url: 'https://…/analysis/…/pages/1.png?X-Amz-…'}
          - {page: 2, preview_url: 'https://…/analysis/…/pages/2.png?X-Amz-…'}
        original_available: true
        reveal_path: /cases/3f2b8c1e-7a4d-4e9b-9c21-5d8e0f6a1b47/documents/8e41d2a9-0c6b-5f37-a1d4-92b7e3c58f10/original
    DocumentOriginal:
      type: object
      required: [case_id, document_id, filename, content_type, url, expires_in, pages]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        filename: {type: string, description: Původní název nahraného souboru}
        content_type: {type: string, example: application/pdf}
        url: {type: string, description: Předpodepsaný odkaz na originál}
        expires_in: {type: integer, description: Platnost odkazů v sekundách, example: 60}
        pages:
          type: array
          description: Čitelné stránky originálu (PNG), stejný rozměr jako zamaskované náhledy stránek
          items:
            type: object
            required: [page, url]
            properties:
              page: {type: integer, minimum: 1}
              url: {type: string, nullable: true, description: 'Předpodepsaný odkaz na PNG stránky; null = stránka ještě není vykreslená'}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    ClientStatus:
      type: string
      enum: [active, inactive, blocked]
    Contact:
      type: object
      properties:
        name: {type: string}
        role: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        preferred_channel: {type: string, enum: [email, phone]}
    Signatory:
      type: object
      properties:
        name: {type: string}
        function: {type: string, example: jednatel}
        authorized: {type: boolean}
    Kyc:
      type: object
      properties:
        status: {type: string, enum: [ok, pending, failed]}
        checked_at: {type: string, format: date}
    Client:
      type: object
      required: [client_id, ico, name, status]
      properties:
        client_id: {type: string, format: uuid}
        ico: {type: string, pattern: '^[0-9]{8}$'}
        dic: {type: string, example: CZ12345678}
        name: {type: string}
        legal_form: {type: string}
        address: {type: string}
        status: {$ref: '#/components/schemas/ClientStatus'}
        contacts: {type: array, items: {$ref: '#/components/schemas/Contact'}}
        signatories: {type: array, items: {$ref: '#/components/schemas/Signatory'}}
        kyc: {$ref: '#/components/schemas/Kyc'}
        source: {type: string, enum: [synthetic]}
    ClientList:
      type: object
      required: [clients, next_token]
      properties:
        clients: {type: array, items: {$ref: '#/components/schemas/Client'}}
        next_token: {type: string, nullable: true}
    CaseStatus:
      type: string
      enum: [open]
    CreateCaseRequest:
      type: object
      required: [client_id]
      properties:
        client_id: {type: string, format: uuid}
        metadata:
          type: object
          additionalProperties: true
          description: Libovolný JSON nejvýš 16 KiB (např. `loan_agreement_no`, `asset_name`, `serial_number`)
    Case:
      type: object
      required: [case_id, client_id, status, created_at, metadata]
      properties:
        case_id: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$', description: 'UUID přidělené službou'}
        client_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CaseStatus'}
        created_at: {type: string, format: date-time}
        metadata: {type: object, additionalProperties: true}
    CaseList:
      type: object
      required: [cases, next_token]
      properties:
        cases: {type: array, items: {$ref: '#/components/schemas/Case'}}
        next_token: {type: string, nullable: true}
    ClientCaseList:
      allOf:
        - $ref: '#/components/schemas/CaseList'
        - type: object
          required: [client_id]
          properties:
            client_id: {type: string, format: uuid}
    ProcessingStatus:
      type: string
      description: Stav zpracování dokumentu; text, vektory a podpisy jsou k dispozici u `completed` a `partial`
      enum: [awaiting_upload, queued, processing, completed, partial, failed]
    NotReady:
      type: object
      required: [error, processing_status]
      properties:
        error: {type: string}
        processing_status:
          type: string
          enum: [awaiting_upload, queued, processing, failed]
    CaseDocumentSummary:
      type: object
      required: [document_id, title, label, label_status, processing_status]
      properties:
        document_id: {type: string}
        title: {type: string, description: 'Původní název souboru, ke klasifikaci se nepoužívá'}
        label: {type: string, nullable: true, description: 'Štítek (typ dokumentu), `null`, dokud není klasifikováno'}
        label_status: {type: string, nullable: true, enum: [predicted, verified]}
        processing_status: {$ref: '#/components/schemas/ProcessingStatus'}
        page_count: {type: integer, nullable: true, description: '`null`, dokud OCR nedoběhlo'}
    CaseDocumentList:
      type: object
      required: [case_id, documents, next_token]
      properties:
        case_id: {type: string}
        documents:
          type: array
          items: {$ref: '#/components/schemas/CaseDocumentSummary'}
        next_token:
          type: string
          nullable: true
          description: Neprůhlivý token další stránky; `null` na poslední
    ValidationDocument:
      type: object
      required: [case_id, document_id, title, label, label_status, description, text, confidence, processing_status]
      properties:
        case_id: {type: string}
        document_id: {type: string, description: 'Stejné jako `blob_id` z uploadu'}
        title: {type: string, description: 'Původní název souboru, ke klasifikaci se nepoužívá'}
        label:
          type: string
          nullable: true
          description: Štítek (typ dokumentu) z taxonomy.yaml
        label_status:
          type: string
          nullable: true
          enum: [predicted, verified]
          description: '`predicted` je strojový odhad, `verified` potvrdil člověk'
        description: {type: string, nullable: true, description: Krátké shrnutí obsahu}
        text: {type: string, description: 'Celý text dokumentu, strany oddělené \f'}
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Jistota klasifikace štítku; `null`, pokud ji zdroj neposkytuje
        page_count: {type: integer}
        pages_failed:
          type: array
          items: {type: integer}
          description: Strany, které se nepodařilo přečíst (jen u `partial`)
        processing_status:
          type: string
          enum: [completed, partial]
        duplicate_of:
          type: array
          description: |
            Dokumenty se stejným obsahem v jiných případech (bez téhož případu); prázdné pole = nikde jinde není.
            Pole chybí, když se index duplicit nepodařilo přečíst.
          items: {$ref: '#/components/schemas/DuplicateOf'}
        duplicate_relevant:
          type: boolean
          description: |
            `true` jen když existuje jiný případ se stejným obsahem, štítek dokumentu je individuální doklad
            (`duplicate_policy: flag` v taxonomy.yaml) a obsah neleží ve 3 a více různých případech (šablona).
            Chybí spolu s `duplicate_of`.
    DuplicateOf:
      type: object
      required: [case_id, document_id, label]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        label:
          type: string
          nullable: true
          description: Štítek původního dokumentu, jak ho zná index; `null`, dokud ho zpracování nedoplnilo
    Vector:
      type: object
      required: [model, model_version, dimension]
      properties:
        model: {type: string}
        model_version: {type: string, description: 'Vektory různých modelů a verzí se nemíchají'}
        dimension: {type: integer}
        values:
          type: array
          items: {type: number}
          description: Hodnoty vektoru; vynechané s `include_values=false`
    TextVector:
      allOf:
        - $ref: '#/components/schemas/Vector'
        - type: object
          required: [chunk_id, page_from, page_to]
          properties:
            chunk_id: {type: string}
            page_from: {type: integer, minimum: 1}
            page_to: {type: integer, minimum: 1}
    ImageVector:
      allOf:
        - $ref: '#/components/schemas/Vector'
        - type: object
          required: [page]
          properties:
            page: {type: integer, minimum: 1}
    Neighbor:
      type: object
      required: [document_id, label, score]
      properties:
        document_id: {type: string}
        label: {type: string}
        score: {type: number, description: 'Kosinová podobnost'}
    DocumentVectors:
      type: object
      required: [case_id, document_id, text_vectors, image_vectors]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        text_vectors:
          type: array
          items: {$ref: '#/components/schemas/TextVector'}
          description: Jeden vektor na část textu; prázdné pole, pokud ještě nevznikly
        image_vectors:
          type: array
          items: {$ref: '#/components/schemas/ImageVector'}
          description: Jeden vektor na stránku; prázdné pole, pokud ještě nevznikly
        neighbors:
          type: array
          items: {$ref: '#/components/schemas/Neighbor'}
          description: Jen s `similar_to_verified`, nejbližší ověřené dokumenty od nejpodobnějšího
    SimilarSignature:
      type: object
      required: [signature_id, document_id, score]
      properties:
        signature_id: {type: string}
        document_id: {type: string}
        score: {type: number}
    CopySuspicion:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [none, suspected, not_checked]
          description: |
            `none` = porovnání proběhlo a kopii nenašlo; `suspected` = nalezen téměř identický podpis v jiném dokumentu;
            `not_checked` = porovnání napříč dokumenty se (zatím) nepočítalo, hodnotu nelze číst jako „bez kopie".
        matches:
          type: array
          description: Podpisy v jiných dokumentech, které jsou téměř identické (perceptuální hash / pixelové porovnání)
          items: {$ref: '#/components/schemas/SimilarSignature'}
    Signature:
      type: object
      required: [signature_id, page, detector, reveal_path, crop_available]
      properties:
        signature_id: {type: string}
        page: {type: integer, minimum: 1}
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
          description: '[x0, y0, x1, y1], relativní souřadnice strany'
        detector: {type: string, enum: [textract, vision_llm, page_images, label_anchored, vector_strokes], description: 'textract = AWS Textract SIGNATURES; page_images = záloha podle vložených obrázků velikosti podpisu; label_anchored = inkoust v oblasti nad popiskem Podpis; vector_strokes = vektorové tahy v kresbě stránky (víc falešných nálezů); vision_llm = vision model'}
        detection_score:
          type: number
          nullable: true
          description: Orientační skóre detektoru (Textract 0 až 100), není kalibrovaná pravděpodobnost; `null` u vision LLM
        role:
          type: string
          nullable: true
          enum: [provider, borrower, buyer, supplier, guarantor, insurer, unknown]
        role_source: {type: string, nullable: true, enum: [nearest_text, ocr_blocks]}
        role_evidence:
          type: string
          nullable: true
          description: Text, podle kterého byla role přiřazena (např. „Za dlužníka")
        preview_url:
          type: string
          nullable: true
          description: |
            Předpodepsané URL (platnost 300 s) zkresleného náhledu výřezu: hrubé rozložení inkoustu, podpis z něj nejde
            přečíst ani okopírovat, lze ho ukázat bez odkrytí. `null`, pokud náhled neexistuje.
        reveal_path:
          type: string
          description: 'Cesta endpointu `revealSignatureImage` pro tento podpis, relativní k adrese serveru: `/cases/{case_id}/documents/{document_id}/signatures/{signature_id}/image`'
        crop_available:
          type: boolean
          description: |
            `true` = existuje šifrovaný výřez a `reveal_path` ho odkryje. `false` = výřez chybí nebo ještě není zašifrovaný
            (starší čitelné výřezy čekají na migraci); `reveal_path` pak vrátí `404` nebo `409`.
        crop_url:
          type: string
          nullable: true
          deprecated: true
          description: |
            Zrušeno. U šifrovaného výřezu se čitelný odkaz nevrací: pole chybí (přechodově může být přítomné s hodnotou
            `null`). Dočasně do migrace (nasazení s `LEGACY_PLAIN_CROP_URL=true`) mají starší nezmigrované čitelné výřezy
            (`crop_available: false`) předpodepsaný odkaz platný 300 s. Použij `preview_url` a `reveal_path`.
        phash: {type: string, nullable: true}
        copy_suspicion: {$ref: '#/components/schemas/CopySuspicion'}
        similar_signatures:
          type: array
          items: {$ref: '#/components/schemas/SimilarSignature'}
          description: |
            Jen s `match_client=true`; nápověda pro člověka, ne ověření pravosti. **Zatím nevyplněno:** index podpisů je prázdný,
            vždy `[]`. Plánovaný význam: podobné podpisy téhož klienta napříč případy (viz docs/validator-agent-audit.md B4).
        vector:
          allOf: [{$ref: '#/components/schemas/Vector'}]
          nullable: true
    DocumentSignatures:
      type: object
      required: [case_id, document_id, signatures, status]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        status:
          type: string
          enum: [completed, not_run, failed]
          description: |
            `completed` = detekce proběhla (prázdné `signatures` pak znamená „nic nenalezeno", ale detekce je neúplná);
            `not_run` = podpisy se pro dokument ještě nezpracovaly (prázdné pole NENÍ nález);
            `failed` = detekce selhala. Prázdné pole smí agent chápat jako „nic nenalezeno" jen při `completed`.
        signatures:
          type: array
          items: {$ref: '#/components/schemas/Signature'}
          description: Prázdné pole znamená „žádný podpis nenalezen", ne chybu
    RegionLine:
      type: object
      required: [bbox, start, end]
      properties:
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
        start: {type: integer, minimum: 0, description: Index prvního znaku řádku v `text`}
        end: {type: integer, minimum: 0, description: Index za posledním znakem řádku v `text`}
    Region:
      type: object
      required: [region_id, page, kind]
      properties:
        region_id: {type: string, description: '`p{strana}-r{pořadí}`, stabilní pro stejný obsah (i po znovupoužití analýzy)'}
        page: {type: integer, minimum: 1}
        kind: {type: string, enum: [paragraph, list_item, table_row, heading, page_header, page_footer]}
        label:
          type: string
          nullable: true
          enum: [povinny_podklad, odkaz_na_dokument, smluvni_strana, predmet, cena_platba, zajisteni, predani,
                 termin_misto, hlavicka, podpisovy_blok, obecne_ustanoveni, jine, null]
          description: Štítek obsahu (model, nebo regexová záloha); odhad, ne jistota
        party:
          type: string
          enum: [provider, borrower, buyer, supplier, guarantor, insurer, unknown]
          description: Jen u `smluvni_strana` a `podpisovy_blok`
        refers_to:
          type: array
          items: {type: string}
          description: Jen u `povinny_podklad` a `odkaz_na_dokument`; štítky dokumentů z taxonomy.yaml, které odstavec vyžaduje nebo zmiňuje
        summary: {type: string, description: Jedna věta od modelu (chybí u regexové zálohy)}
        excerpt: {type: string, description: 'Jen s `outline=true`: začátek textu'}
        section: {type: string, nullable: true, description: '`region_id` posledního nadpisu nad regionem'}
        text: {type: string, description: 'Text regionu; buňky řádku tabulky dělí ` | `. Chybí s `outline=true`'}
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
          description: '[x0, y0, x1, y1] relativně ke straně (jen s geometrií)'
        lines:
          type: array
          items: {$ref: '#/components/schemas/RegionLine'}
    RegionPage:
      type: object
      required: [page, source]
      properties:
        page: {type: integer, minimum: 1}
        width: {type: number}
        height: {type: number}
        source: {type: string, enum: [text_layer, no_text_layer], description: '`no_text_layer` = sken, regiony zatím nemá'}
    DocumentRegions:
      type: object
      required: [case_id, document_id, title, status, pages, regions]
      properties:
        case_id: {type: string}
        document_id: {type: string}
        title: {type: string}
        document_label: {type: string, nullable: true}
        status: {type: string, enum: [completed, not_run, failed, not_ready]}
        processing_status: {$ref: '#/components/schemas/ProcessingStatus'}
        pages:
          type: array
          items: {$ref: '#/components/schemas/RegionPage'}
        regions:
          type: array
          items: {$ref: '#/components/schemas/Region'}
        missing_ids:
          type: array
          items: {type: string}
          description: Jen s `ids=`; požadovaná id, která dokument nemá
    CaseRegions:
      type: object
      required: [case_id, regions, documents_without_regions]
      properties:
        case_id: {type: string}
        regions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Region'
              - type: object
                required: [document_id, title]
                properties:
                  document_id: {type: string}
                  title: {type: string}
                  document_label: {type: string, nullable: true}
        documents_without_regions:
          type: array
          items:
            type: object
            required: [document_id, status]
            properties:
              document_id: {type: string}
              title: {type: string}
              status: {type: string, enum: [not_run, failed, not_ready]}
